<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Entregas Semanal</title>

    <!-- METAS PARA FUNCIONAR COMO APP REAL (SEM BARRA DO NAVEGADOR) -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Entregas">
    <meta name="theme-color" content="#0f172a">

    <!-- MANIFEST EMBUTIDO -->
    <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Gestor%20de%20Entregas%22%2C%22short_name%22%3A%22Entregas%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f172a%22%2C%22theme_color%22%3A%22%230f172a%22%7D">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --accent-orange: #f59e0b;
            --accent-pink: #ec4899;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 30px; }

        /* Navbar Otimizada para Mobile */
        .navbar {
            background-color: #1e293b;
            border-bottom: 1px solid var(--card-border);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        .navbar-brand { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .navbar-actions { display: flex; gap: 6px; align-items: center; }

        .nav-btn {
            background: #334155;
            color: #f8fafc;
            border: 1px solid var(--card-border);
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: 0.15s;
        }
        .nav-btn:active { transform: scale(0.95); }
        .nav-btn-sync { border-color: #3b82f6; color: #93c5fd; }
        .nav-btn-history { border-color: var(--accent-purple); color: #c4b5fd; background: rgba(139, 92, 246, 0.15); }
        .nav-btn-reset { border-color: var(--accent-danger); background: rgba(239, 68, 68, 0.15); color: #fca5a5; }

        /* Dropdown */
        .dropdown { position: relative; }
        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 115%;
            background-color: #1e293b;
            min-width: 190px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            z-index: 100;
            overflow: hidden;
        }
        .dropdown-content.show { display: block; }
        .dropdown-item {
            color: var(--text-main);
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .dropdown-item:active { background: #334155; }

        /* Content Container */
        .container { max-width: 1200px; margin: 12px auto 0 auto; padding: 0 12px; }

        /* Resumo Global Mobile (3 Colunas Compactas) */
        .resumo-global {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        .box-global {
            padding: 10px 6px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 0.75rem;
        }
        .box-lucro { background: rgba(245, 158, 11, 0.15); border: 1px solid var(--accent-orange); color: #fbbf24; }
        .box-adar { background: rgba(236, 72, 153, 0.15); border: 1px solid var(--accent-pink); color: #f472b6; }
        .box-total { background: rgba(59, 130, 246, 0.15); border: 1px solid var(--accent-blue); color: #60a5fa; }
        .box-global span { display: block; font-size: 1.1rem; margin-top: 4px; }

        /* Grid de Cards */
        .cards-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        @media (min-width: 600px) {
            .cards-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (min-width: 900px) {
            .cards-grid { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
        }

        .day-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .day-title { font-size: 1rem; font-weight: 700; }
        .count-tag { font-size: 0.75rem; background: #0f172a; border: 1px solid var(--card-border); padding: 2px 8px; border-radius: 10px; color: var(--text-muted); }

        .day-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            background: #0f172a;
            padding: 10px 6px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-item small { display: block; font-size: 0.7rem; color: var(--text-muted); margin-bottom: 2px; }
        .stat-item b { font-size: 0.95rem; }

        /* Botões de Ação do Card */
        .day-actions { display: flex; gap: 8px; }
        .btn-action {
            background: #334155;
            color: #fff;
            border: none;
            border-radius: 10px;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .btn-action:active { transform: scale(0.97); }
        .btn-plus { flex: 3; background: #2563eb; color: #fff; }
        .btn-eye { flex: 1; font-size: 1.2rem; }

        /* Modais Otimizados para Ecrã de Telemóvel */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: flex-end; /* Abre por baixo estilo gaveta em mobile */
            z-index: 1000;
        }
        @media (min-width: 600px) {
            .modal-overlay { align-items: center; padding: 20px; }
        }

        .modal-overlay.active { display: flex; }

        .modal-card {
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 580px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @media (min-width: 600px) {
            .modal-card { border-radius: 18px; animation: zoomIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        }
        .modal-card-large { max-width: 750px; }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-header {
            padding: 16px;
            background: #0f172a;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h3 { font-size: 1.1rem; }
        .btn-modal-close {
            background: #334155;
            color: #fff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .modal-body { padding: 16px; overflow-y: auto; }

        /* Formulários Mobile */
        .form-group { display: flex; flex-direction: column; gap: 12px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; display: block; }
        input {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            font-size: 1rem;
            -webkit-appearance: none;
        }
        input:focus { outline: none; border-color: var(--accent-blue); }

        .btn-submit {
            background: #10b981;
            color: #fff;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            margin-top: 6px;
        }
        .btn-submit:active { background: #059669; }

        /* Tabelas com Scroll Horizontal Seguro */
        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; min-width: 380px; font-size: 0.85rem; }
        th, td { padding: 10px 6px; text-align: center; border-bottom: 1px solid var(--card-border); }
        th { color: var(--text-muted); background: #0f172a; font-size: 0.75rem; }
        .btn-tbl { padding: 6px 10px; border: none; border-radius: 6px; font-size: 0.85rem; }
        .btn-tbl-edit { background: #eab308; color: #000; }
        .btn-tbl-del { background: #ef4444; color: #fff; margin-left: 4px; }

        .history-list-item {
            background: #0f172a;
            border: 1px solid var(--card-border);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <input type="file" id="fileInput" accept=".json" style="display: none;" onchange="importarFicheiroLocal(event)">

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="navbar-brand">🛵 <span>Entregas</span></div>
        <div class="navbar-actions">
            <button class="nav-btn nav-btn-sync" onclick="sincronizarComGithub()" title="Sincronizar">🔄</button>
            <button class="nav-btn nav-btn-history" onclick="abrirModalHistorico()">📜 Semanas</button>
            <button class="nav-btn nav-btn-reset" onclick="fecharSemana()">🧹</button>
            
            <div class="dropdown">
                <button class="nav-btn" onclick="toggleDropdown()" id="btnDropdown">⚙️</button>
                <div class="dropdown-content" id="dropdownMenu">
                    <div class="dropdown-item" onclick="abrirModalConfig(); fecharDropdown();">🔑 API GitHub</div>
                    <div class="dropdown-item" onclick="document.getElementById('fileInput').click(); fecharDropdown();">📂 Importar</div>
                    <div class="dropdown-item" onclick="exportarFicheiroLocal(); fecharDropdown();">💾 Exportar</div>
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="container">
        <!-- 3 Balões compactos no topo -->
        <div class="resumo-global">
            <div class="box-global box-lucro">Lucro <span id="gloLucro">0.00€</span></div>
            <div class="box-global box-adar">A Dar <span id="gloAdar">0.00€</span></div>
            <div class="box-global box-total">Total <span id="gloTotal">0.00€</span></div>
        </div>

        <div class="cards-grid" id="cardsGrid"></div>
    </div>

    <!-- MODAL CONFIGURAÇÃO GITHUB -->
    <div class="modal-overlay" id="modalConfigOverlay" onclick="fecharModalFora(event, 'modalConfigOverlay')">
        <div class="modal-card">
            <div class="modal-header">
                <h3>⚙️ Configuração GitHub</h3>
                <button class="btn-modal-close" onclick="fecharModalConfig()">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <div>
                        <label>Utilizador GitHub</label>
                        <input type="text" id="cfgUser" value="goncalobrito">
                    </div>
                    <div>
                        <label>Nome do Repositório</label>
                        <input type="text" id="cfgRepo" value="goncalobrito.github.io">
                    </div>
                    <div>
                        <label>Token (PAT)</label>
                        <input type="password" id="cfgToken" placeholder="github_pat_... ou ghp_...">
                    </div>
                    <button class="btn-submit" onclick="guardarConfiguracoes()">Guardar e Conectar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL FORMULÁRIO (ADD / EDIT) -->
    <div class="modal-overlay" id="modalFormOverlay" onclick="fecharModalFora(event, 'modalFormOverlay')">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalFormTitulo">➕ Registar Entrega</h3>
                <button class="btn-modal-close" onclick="fecharModalForm()">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <div>
                        <label>Local / Restaurante</label>
                        <input type="text" id="formLocal" placeholder="ex: Mc, Divinal, Padaria">
                    </div>
                    <div class="form-row">
                        <div>
                            <label>Pagou (€)</label>
                            <input type="number" step="0.01" inputmode="decimal" id="formPagou" placeholder="0.00">
                        </div>
                        <div>
                            <label>Paguei (€)</label>
                            <input type="number" step="0.01" inputmode="decimal" id="formPaguei" placeholder="0.00">
                        </div>
                    </div>
                    <div>
                        <label>Taxa Entrega / Lucro (€)</label>
                        <input type="number" step="0.01" inputmode="decimal" id="formTaxa" placeholder="0.00">
                    </div>
                    <button class="btn-submit" id="btnSubmitForm" onclick="submeterFormulario()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL LISTA DE PEDIDOS DO DIA -->
    <div class="modal-overlay" id="modalListOverlay" onclick="fecharModalFora(event, 'modalListOverlay')">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalListTitulo">📦 Pedidos</h3>
                <button class="btn-modal-close" onclick="fecharModalList()">✕</button>
            </div>
            <div class="modal-body" id="modalListConteudo"></div>
        </div>
    </div>

    <!-- MODAL HISTÓRICO DE SEMANAS -->
    <div class="modal-overlay" id="modalHistoryOverlay" onclick="fecharModalFora(event, 'modalHistoryOverlay')">
        <div class="modal-card modal-card-large">
            <div class="modal-header">
                <h3>📜 Semanas no GitHub</h3>
                <button class="btn-modal-close" onclick="fecharModalHistorico()">✕</button>
            </div>
            <div class="modal-body">
                <div id="historyListArea">
                    <p style="color:var(--text-muted); text-align: center;">A carregar histórico...</p>
                </div>
                <div id="historyDetailArea" style="display:none;"></div>
            </div>
        </div>
    </div>

    <script>
        const diasSemana = [
            "Segunda-Feira", "Terça-Feira", "Quarta-Feira", 
            "Quinta-Feira", "Sexta-Feira", "Sábado", "Domingo"
        ];

        let registos = JSON.parse(localStorage.getItem('entregas_v2')) || [];
        let diaAtivo = null;
        let idEdicao = null;

        let ghConfig = JSON.parse(localStorage.getItem('gh_config')) || {
            user: 'goncalobrito',
            repo: 'goncalobrito.github.io',
            token: ''
        };

        function toggleDropdown() { document.getElementById('dropdownMenu').classList.toggle('show'); }
        function fecharDropdown() { document.getElementById('dropdownMenu').classList.remove('show'); }

        window.addEventListener('click', (e) => {
            if (!e.target.closest('.dropdown')) fecharDropdown();
        });

        function calcularTotais(lista = registos) {
            let lucro = 0, adar = 0;
            lista.forEach(r => {
                const taxa = parseFloat(r.taxaEntrega) || 0;
                const valTaxas = (parseFloat(r.pagou) || 0) - (parseFloat(r.paguei) || 0);
                const valorAdar = valTaxas - taxa;

                lucro += taxa;
                adar += valorAdar;
            });
            return { lucro, adar, total: lucro + adar, count: lista.length };
        }

        function renderizar() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            const globais = calcularTotais(registos);
            document.getElementById('gloLucro').innerText = globais.lucro.toFixed(2) + '€';
            document.getElementById('gloAdar').innerText = globais.adar.toFixed(2) + '€';
            document.getElementById('gloTotal').innerText = globais.total.toFixed(2) + '€';

            diasSemana.forEach(dia => {
                const filtrados = registos.filter(r => r.dia === dia);
                const stats = calcularTotais(filtrados);

                grid.innerHTML += `
                    <div class="day-card">
                        <div class="day-header">
                            <span class="day-title">${dia}</span>
                            <span class="count-tag">${stats.count} pedidos</span>
                        </div>

                        <div class="day-stats">
                            <div class="stat-item">
                                <small>Lucro</small>
                                <b style="color: #fbbf24;">${stats.lucro.toFixed(2)}€</b>
                            </div>
                            <div class="stat-item">
                                <small>A Dar</small>
                                <b style="color: #f472b6;">${stats.adar.toFixed(2)}€</b>
                            </div>
                            <div class="stat-item">
                                <small>Total</small>
                                <b>${stats.total.toFixed(2)}€</b>
                            </div>
                        </div>

                        <div class="day-actions">
                            <button class="btn-action btn-plus" onclick="abrirModalForm('${dia}')">➕ Registar</button>
                            <button class="btn-action btn-eye" onclick="abrirModalList('${dia}')">👁</button>
                        </div>
                    </div>
                `;
            });

            localStorage.setItem('entregas_v2', JSON.stringify(registos));
        }

        /* --- GITHUB API --- */
        async function salvarFicheiroNoGithub(caminho, dadosObj, commitMsg) {
            if (!ghConfig.token || !ghConfig.user || !ghConfig.repo) return false;

            const url = `https://api.github.com/repos/${ghConfig.user}/${ghConfig.repo}/contents/${caminho}`;
            let sha = null;
            try {
                const resExist = await fetch(url, { headers: { 'Authorization': `Bearer ${ghConfig.token}` } });
                if (resExist.ok) {
                    const dataExist = await resExist.json();
                    sha = dataExist.sha;
                }
            } catch (e) {}

            const conteudoBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(dadosObj, null, 2))));
            const body = { message: commitMsg, content: conteudoBase64, ...(sha && { sha }) };

            const response = await fetch(url, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${ghConfig.token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            return response.ok;
        }

        async function sincronizarComGithub(silencioso = false) {
            if (!ghConfig.token) {
                if (!silencioso) abrirModalConfig();
                return;
            }

            try {
                const url = `https://api.github.com/repos/${ghConfig.user}/${ghConfig.repo}/contents/pedeja/dados_atuais.json`;
                const res = await fetch(url, { headers: { 'Authorization': `Bearer ${ghConfig.token}` } });

                if (res.ok) {
                    const data = await res.json();
                    const conteudo = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                    if (Array.isArray(conteudo)) {
                        registos = conteudo;
                        renderizar();
                        if (!silencioso) alert("Sincronizado com o GitHub!");
                    }
                } else if (registos.length > 0) {
                    await salvarFicheiroNoGithub('pedeja/dados_atuais.json', registos, 'Atualização inicial');
                }
            } catch (e) {
                if (!silencioso) alert("Erro ao sincronizar. Verifica a chave no ⚙️.");
            }
        }

        async function autoSalvarNoGithub() {
            if (ghConfig.token) {
                await salvarFicheiroNoGithub('pedeja/dados_atuais.json', registos, 'Atualização de entregas');
            }
        }

        /* --- CONFIGURAÇÕES --- */
        function abrirModalConfig() {
            document.getElementById('cfgUser').value = ghConfig.user || 'goncalobrito';
            document.getElementById('cfgRepo').value = ghConfig.repo || 'goncalobrito.github.io';
            document.getElementById('cfgToken').value = ghConfig.token || '';
            document.getElementById('modalConfigOverlay').classList.add('active');
        }
        function fecharModalConfig() { document.getElementById('modalConfigOverlay').classList.remove('active'); }

        function guardarConfiguracoes() {
            ghConfig.user = document.getElementById('cfgUser').value.trim();
            ghConfig.repo = document.getElementById('cfgRepo').value.trim();
            ghConfig.token = document.getElementById('cfgToken').value.trim();

            localStorage.setItem('gh_config', JSON.stringify(ghConfig));
            fecharModalConfig();
            alert("Configurações guardadas!");
            sincronizarComGithub();
        }

        /* --- FORMULÁRIO --- */
        function abrirModalForm(dia, indexEditar = null) {
            diaAtivo = dia;
            idEdicao = indexEditar;

            const modal = document.getElementById('modalFormOverlay');
            const titulo = document.getElementById('modalFormTitulo');
            const btnSubmit = document.getElementById('btnSubmitForm');

            if (indexEditar !== null) {
                const item = registos[indexEditar];
                titulo.innerText = `✏️ Editar (${dia})`;
                btnSubmit.innerText = "Atualizar Entrega";

                document.getElementById('formLocal').value = item.local;
                document.getElementById('formPagou').value = item.pagou;
                document.getElementById('formPaguei').value = item.paguei;
                document.getElementById('formTaxa').value = item.taxaEntrega;
            } else {
                titulo.innerText = `➕ Registar (${dia})`;
                btnSubmit.innerText = "Adicionar Entrega";
                limparFormulario();
            }

            modal.classList.add('active');
            setTimeout(() => document.getElementById('formLocal').focus(), 150);
        }

        function fecharModalForm() {
            document.getElementById('modalFormOverlay').classList.remove('active');
            limparFormulario();
            diaAtivo = null;
            idEdicao = null;
        }

        async function submeterFormulario() {
            const local = document.getElementById('formLocal').value.trim();
            const pagou = parseFloat(document.getElementById('formPagou').value) || 0;
            const paguei = parseFloat(document.getElementById('formPaguei').value) || 0;
            const taxaEntrega = parseFloat(document.getElementById('formTaxa').value) || 0;

            if (!local) {
                alert("Indica o nome do local.");
                return;
            }

            const payload = { dia: diaAtivo, local, pagou, paguei, taxaEntrega };

            if (idEdicao !== null) {
                registos[idEdicao] = payload;
            } else {
                registos.push(payload);
            }

            fecharModalForm();
            renderizar();
            await autoSalvarNoGithub();
        }

        function limparFormulario() {
            document.getElementById('formLocal').value = '';
            document.getElementById('formPagou').value = '';
            document.getElementById('formPaguei').value = '';
            document.getElementById('formTaxa').value = '';
        }

        /* --- LISTA DE PEDIDOS DO DIA --- */
        function abrirModalList(dia) {
            diaAtivo = dia;
            document.getElementById('modalListTitulo').innerText = `📦 ${dia}`;
            renderizarListaDia(dia);
            document.getElementById('modalListOverlay').classList.add('active');
        }
        function fecharModalList() { document.getElementById('modalListOverlay').classList.remove('active'); }

        function renderizarListaDia(dia) {
            const entregas = registos.filter(r => r.dia === dia);
            const container = document.getElementById('modalListConteudo');

            if (entregas.length === 0) {
                container.innerHTML = `<p style="text-align:center; color: var(--text-muted); padding: 20px;">Nenhum pedido registado.</p>`;
                return;
            }

            let html = `
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Local</th>
                                <th>Pagou</th>
                                <th>Paguei</th>
                                <th>Taxa</th>
                                <th>A Dar</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            entregas.forEach(r => {
                const indexReal = registos.indexOf(r);
                const valTaxas = r.pagou - r.paguei;
                const valAdar = valTaxas - r.taxaEntrega;

                html += `
                    <tr>
                        <td><b>${r.local}</b></td>
                        <td>${r.pagou.toFixed(2)}€</td>
                        <td>${r.paguei.toFixed(2)}€</td>
                        <td>${r.taxaEntrega.toFixed(2)}€</td>
                        <td style="color: #f472b6;"><b>${valAdar.toFixed(2)}€</b></td>
                        <td>
                            <button class="btn-tbl btn-tbl-edit" onclick="iniciarEdicaoViaModal(${indexReal})">✏️</button>
                            <button class="btn-tbl btn-tbl-del" onclick="removerRegisto(${indexReal})">🗑️</button>
                        </td>
                    </tr>
                `;
            });

            html += `</tbody></table></div>`;
            container.innerHTML = html;
        }

        function iniciarEdicaoViaModal(index) {
            const item = registos[index];
            fecharModalList();
            abrirModalForm(item.dia, index);
        }

        async function removerRegisto(index) {
            if (confirm("Apagar este pedido?")) {
                const diaAtual = registos[index].dia;
                registos.splice(index, 1);
                renderizar();
                renderizarListaDia(diaAtual);
                await autoSalvarNoGithub();
            }
        }

        /* --- HISTÓRICO --- */
        async function abrirModalHistorico() {
            document.getElementById('modalHistoryOverlay').classList.add('active');
            document.getElementById('historyDetailArea').style.display = 'none';
            const listArea = document.getElementById('historyListArea');
            listArea.style.display = 'block';

            if (!ghConfig.token) {
                listArea.innerHTML = `<p style="color:var(--text-muted); text-align:center;">Configura a API Key no ⚙️ primeiro.</p>`;
                return;
            }

            listArea.innerHTML = `<p style="color:var(--text-muted); text-align: center;">A carregar semanas...</p>`;

            try {
                const url = `https://api.github.com/repos/${ghConfig.user}/${ghConfig.repo}/contents/pedeja/historico`;
                const res = await fetch(url, { headers: { 'Authorization': `Bearer ${ghConfig.token}` } });
                
                if (!res.ok) {
                    listArea.innerHTML = `<p style="color:var(--text-muted); text-align:center;">Ainda não existem semanas arquivadas.</p>`;
                    return;
                }

                const ficheiros = await res.json();
                const jsonFiles = ficheiros.filter(f => f.name.endsWith('.json'));

                if (jsonFiles.length === 0) {
                    listArea.innerHTML = `<p style="color:var(--text-muted); text-align:center;">Nenhum registo encontrado.</p>`;
                    return;
                }

                let html = ``;
                jsonFiles.forEach(f => {
                    const nomeFormatado = f.name.replace('semana_', 'Semana ').replace('.json', '').replace(/_/g, '/');
                    html += `
                        <div class="history-list-item">
                            <span>📅 <b>${nomeFormatado}</b></span>
                            <button class="nav-btn nav-btn-history" onclick="carregarDetalheSemana('${f.path}')">Ver</button>
                        </div>
                    `;
                });

                listArea.innerHTML = html;
            } catch (e) {
                listArea.innerHTML = `<p style="color:var(--accent-danger); text-align:center;">Erro ao ligar ao GitHub.</p>`;
            }
        }

        async function carregarDetalheSemana(path) {
            const detailArea = document.getElementById('historyDetailArea');
            const listArea = document.getElementById('historyListArea');

            try {
                const url = `https://api.github.com/repos/${ghConfig.user}/${ghConfig.repo}/contents/${path}`;
                const res = await fetch(url, { headers: { 'Authorization': `Bearer ${ghConfig.token}` } });
                const fileData = await res.json();
                const dados = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));

                const lista = Array.isArray(dados) ? dados : (dados.registos || []);
                const semanaFim = dados.semana_fim || path;
                const totais = calcularTotais(lista);

                listArea.style.display = 'none';
                detailArea.style.display = 'block';

                let html = `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                        <button class="nav-btn" onclick="voltarParaListaHistorico()">⬅️ Voltar</button>
                        <button class="nav-btn" style="background:#2563eb; color:#fff;" onclick='restaurarSemanaHistorico(${JSON.stringify(lista)})'>
                            🔄 Restaurar
                        </button>
                    </div>

                    <div style="background:#0f172a; padding:10px; border-radius:10px; border:1px solid var(--card-border); margin-bottom:12px; display:grid; grid-template-columns: repeat(3, 1fr); text-align:center; font-size:0.8rem;">
                        <div><small style="color:var(--text-muted);">Lucro</small><br><b style="color:#fbbf24;">${totais.lucro.toFixed(2)}€</b></div>
                        <div><small style="color:var(--text-muted);">A Dar</small><br><b style="color:#f472b6;">${totais.adar.toFixed(2)}€</b></div>
                        <div><small style="color:var(--text-muted);">Total</small><br><b>${totais.total.toFixed(2)}€</b></div>
                    </div>

                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr><th>Dia</th><th>Local</th><th>Pagou</th><th>Paguei</th><th>Taxa</th><th>A Dar</th></tr>
                            </thead>
                            <tbody>
                `;

                lista.forEach(r => {
                    const valTaxas = (r.pagou || 0) - (r.paguei || 0);
                    const valAdar = valTaxas - (r.taxaEntrega || 0);
                    html += `
                        <tr>
                            <td><b>${r.dia}</b></td>
                            <td>${r.local}</td>
                            <td>${r.pagou.toFixed(2)}€</td>
                            <td>${r.paguei.toFixed(2)}€</td>
                            <td>${r.taxaEntrega.toFixed(2)}€</td>
                            <td style="color:#f472b6;">${valAdar.toFixed(2)}€</td>
                        </tr>
                    `;
                });

                html += `</tbody></table></div>`;
                detailArea.innerHTML = html;
            } catch (e) {
                alert("Erro ao abrir detalhes.");
            }
        }

        async function restaurarSemanaHistorico(lista) {
            if (confirm("Restaurar estes registos para a semana ativa?")) {
                registos = lista;
                renderizar();
                await autoSalvarNoGithub();
                fecharModalHistorico();
                alert("Semana restaurada!");
            }
        }

        function voltarParaListaHistorico() {
            document.getElementById('historyDetailArea').style.display = 'none';
            document.getElementById('historyListArea').style.display = 'block';
        }

        function fecharModalHistorico() { document.getElementById('modalHistoryOverlay').classList.remove('active'); }

        /* --- FECHAR SEMANA --- */
        function obterDataFimSemana() {
            const hoje = new Date();
            const diaSemana = hoje.getDay(); 
            const diasAteDomingo = (diaSemana === 0) ? 0 : (7 - diaSemana);
            
            const domingo = new Date(hoje);
            domingo.setDate(hoje.getDate() + diasAteDomingo);

            const dia = String(domingo.getDate()).padStart(2, '0');
            const mes = String(domingo.getMonth() + 1).padStart(2, '0');
            const ano = domingo.getFullYear();

            return {
                formatadoLegivel: `${dia}/${mes}/${ano}`,
                formatadoFicheiro: `${dia}_${mes}_${ano}`
            };
        }

        async function fecharSemana() {
            if (registos.length === 0) {
                alert("Não existem dados para fechar.");
                return;
            }

            const dataSemana = obterDataFimSemana();
            const confirmacao = confirm(
                `Fechar a semana de ${dataSemana.formatadoLegivel}?\n\nOs dados serão arquivados no GitHub e o painel voltará a zeros.`
            );

            if (!confirmacao) return;

            const totais = calcularTotais(registos);
            const relatorioHistorico = {
                semana_fim: dataSemana.formatadoLegivel,
                resumo: {
                    lucro_total: totais.lucro.toFixed(2) + "€",
                    valor_a_dar_total: totais.adar.toFixed(2) + "€",
                    balanco_geral: totais.total.toFixed(2) + "€",
                    total_pedidos: totais.count
                },
                registos: registos
            };

            const caminhoHist = `pedeja/historico/semana_${dataSemana.formatadoFicheiro}.json`;
            await salvarFicheiroNoGithub(caminhoHist, relatorioHistorico, `Arquivo Semana ${dataSemana.formatadoLegivel}`);

            registos = [];
            localStorage.removeItem('entregas_v2');
            await salvarFicheiroNoGithub('pedeja/dados_atuais.json', [], 'Reset de início de semana');

            renderizar();
            alert(`Semana fechada e guardada no GitHub!`);
        }

        /* --- IMPORTAR / EXPORTAR LOCAL --- */
        function exportarFicheiroLocal() {
            if (registos.length === 0) return alert("Sem dados para exportar.");
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(registos, null, 2));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = "entregas_backup.json";
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        function importarFicheiroLocal(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const dados = JSON.parse(e.target.result);
                    const lista = Array.isArray(dados) ? dados : (dados.registos || null);
                    if (lista && Array.isArray(lista)) {
                        registos = lista;
                        renderizar();
                        await autoSalvarNoGithub();
                        alert("Dados importados com sucesso!");
                    } else alert("Ficheiro inválido.");
                } catch (err) { alert("Erro ao ler o ficheiro."); }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function fecharModalFora(e, overlayId) {
            if (e.target.id === overlayId) document.getElementById(overlayId).classList.remove('active');
        }

        renderizar();
        if (ghConfig.token) sincronizarComGithub(true);
    </script>
</body>
</html>
