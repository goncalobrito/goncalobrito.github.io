<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor Semanal de Entregas</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --accent-orange: #f59e0b;
            --accent-pink: #ec4899;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 40px; }

        /* Navbar */
        .navbar {
            background-color: #1e293b;
            border-bottom: 1px solid var(--card-border);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            gap: 10px;
        }
        .navbar-brand { font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .navbar-actions { display: flex; gap: 8px; align-items: center; }

        .nav-btn {
            background: #334155;
            color: #f8fafc;
            border: 1px solid var(--card-border);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .nav-btn:hover { background: #475569; }
        .nav-btn-sync { border-color: #3b82f6; color: #93c5fd; }
        .nav-btn-history { border-color: var(--accent-purple); color: #c4b5fd; background: rgba(139, 92, 246, 0.15); }
        .nav-btn-history:hover { background: var(--accent-purple); color: #fff; }
        .nav-btn-reset { border-color: var(--accent-danger); background: rgba(239, 68, 68, 0.15); color: #fca5a5; }
        .nav-btn-reset:hover { background: var(--accent-danger); color: #fff; }

        /* Dropdown da Engrenagem */
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 110%;
            background-color: #1e293b;
            min-width: 190px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            z-index: 100;
            overflow: hidden;
        }
        .dropdown-content.show { display: block; animation: fadeIn 0.15s ease-in; }
        .dropdown-item {
            color: var(--text-main);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            text-decoration: none;
            transition: 0.2s;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:hover { background-color: #334155; color: #fff; }

        /* Container */
        .container { max-width: 1200px; margin: 20px auto 0 auto; padding: 0 16px; }

        /* Resumo Global */
        .resumo-global {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .box-global { padding: 15px; border-radius: 12px; text-align: center; font-weight: bold; }
        .box-lucro { background: rgba(245, 158, 11, 0.15); border: 1px solid var(--accent-orange); color: #fbbf24; }
        .box-adar { background: rgba(236, 72, 153, 0.15); border: 1px solid var(--accent-pink); color: #f472b6; }
        .box-total { background: rgba(59, 130, 246, 0.15); border: 1px solid var(--accent-blue); color: #60a5fa; }
        .box-global span { display: block; font-size: 1.4rem; margin-top: 5px; }

        /* 7 Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .day-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .day-title { font-size: 1.1rem; font-weight: bold; }
        .count-tag { font-size: 0.8rem; background: #334155; padding: 2px 8px; border-radius: 12px; color: var(--text-muted); }

        .day-stats {
            display: flex;
            justify-content: space-between;
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .stat-item { text-align: center; }
        .stat-item small { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
        .stat-item b { font-size: 1rem; }

        /* Botões */
        .day-actions { display: flex; gap: 10px; }
        .btn-action {
            background: #334155;
            color: #fff;
            border: none;
            border-radius: 10px;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1rem;
        }
        .btn-action:hover { background: #475569; }
        .btn-plus { flex: 2; background: #2563eb; font-weight: bold; }
        .btn-plus:hover { background: #1d4ed8; }
        .btn-eye { flex: 1; font-size: 1.2rem; }

        /* Modais */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }

        .modal-card {
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 18px;
            width: 100%;
            max-width: 580px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            animation: zoomIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .modal-card-large { max-width: 750px; }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.7); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            padding: 16px 20px;
            background: #0f172a;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h3 { font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
        
        .btn-modal-close {
            background: #334155;
            color: #fff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }
        .btn-modal-close:hover { background: #ef4444; }
        .modal-body { padding: 20px; overflow-y: auto; }

        /* Formulários */
        .form-group { display: flex; flex-direction: column; gap: 12px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .full-width { grid-column: span 2; }
        label { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; display: block; }
        input {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.95rem;
        }
        input:focus { outline: none; border-color: var(--accent-blue); }
        
        .btn-submit {
            background: #10b981;
            color: #fff;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            margin-top: 8px;
        }
        .btn-submit:hover { background: #059669; }

        /* Tabelas */
        table { width: 100%; border-collapse: collapse; margin-top: 5px; font-size: 0.9rem; }
        th, td { padding: 10px 8px; text-align: center; border-bottom: 1px solid var(--card-border); }
        th { color: var(--text-muted); background: #0f172a; }
        .btn-tbl { padding: 6px 10px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
        .btn-tbl-edit { background: #eab308; color: #000; font-weight: bold; }
        .btn-tbl-del { background: #ef4444; color: #fff; margin-left: 4px; font-weight: bold; }

        /* Histórico Cloud List */
        .history-list-item {
            background: #0f172a;
            border: 1px solid var(--card-border);
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- Input escondido para importar ficheiro local -->
    <input type="file" id="fileInput" accept=".json" style="display: none;" onchange="importarFicheiroLocal(event)">

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="navbar-brand">🛵 <span>Entregas Semanal</span></div>
        <div class="navbar-actions">
            <!-- Botão de Refresh / Sincronizar -->
            <button class="nav-btn nav-btn-sync" onclick="sincronizarComGithub()" title="Sincronizar com o GitHub">🔄</button>
            <button class="nav-btn nav-btn-history" onclick="abrirModalHistorico()">📜 Histórico</button>
            <button class="nav-btn nav-btn-reset" onclick="fecharSemana()">🧹 Fechar Semana</button>
            
            <!-- Dropdown da Engrenagem -->
            <div class="dropdown">
                <button class="nav-btn" onclick="toggleDropdown()" id="btnDropdown">⚙️</button>
                <div class="dropdown-content" id="dropdownMenu">
                    <div class="dropdown-item" onclick="abrirModalConfig(); fecharDropdown();">
                        🔑 API Key GitHub
                    </div>
                    <div class="dropdown-item" onclick="document.getElementById('fileInput').click(); fecharDropdown();">
                        📂 Importar (.json)
                    </div>
                    <div class="dropdown-item" onclick="exportarFicheiroLocal(); fecharDropdown();">
                        💾 Exportar (.json)
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="container">
        <div class="resumo-global">
            <div class="box-global box-lucro">Meu Lucro Total <span id="gloLucro">0.00€</span></div>
            <div class="box-global box-adar">Valor a Dar Total <span id="gloAdar">0.00€</span></div>
            <div class="box-global box-total">Balanço Geral <span id="gloTotal">0.00€</span></div>
        </div>

        <div class="cards-grid" id="cardsGrid"></div>
    </div>

    <!-- MODAL CONFIGURAÇÃO GITHUB -->
    <div class="modal-overlay" id="modalConfigOverlay" onclick="fecharModalFora(event, 'modalConfigOverlay')">
        <div class="modal-card">
            <div class="modal-header">
                <h3>⚙️ Configuração da API do GitHub</h3>
                <button class="btn-modal-close" onclick="fecharModalConfig()">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <div>
                        <label>Utilizador GitHub</label>
                        <input type="text" id="cfgUser" value="goncalobrito">
                    </div>
                    <div>
                        <label>Nome do Repositório</label>
                        <input type="text" id="cfgRepo" value="goncalobrito.github.io">
                    </div>
                    <div>
                        <label>Personal Access Token (PAT)</label>
                        <input type="password" id="cfgToken" placeholder="github_pat_... ou ghp_...">
                    </div>
                    <button class="btn-submit" onclick="guardarConfiguracoes()">Guardar e Conectar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL FORMULÁRIO -->
    <div class="modal-overlay" id="modalFormOverlay" onclick="fecharModalFora(event, 'modalFormOverlay')">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalFormTitulo">➕ Registar Entrega</h3>
                <button class="btn-modal-close" onclick="fecharModalForm()">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <div>
                        <label>Nome do Local / Restaurante</label>
                        <input type="text" id="formLocal" placeholder="ex: mc, divinal, padaria">
                    </div>
                    <div class="form-row">
                        <div>
                            <label>Valor Pago pelo Cliente (€)</label>
                            <input type="number" step="0.01" id="formPagou" placeholder="0.00">
                        </div>
                        <div>
                            <label>Valor que Paguei no Local (€)</label>
                            <input type="number" step="0.01" id="formPaguei" placeholder="0.00">
                        </div>
                    </div>
                    <div>
                        <label>Taxa de Entrega (Meu Lucro) (€)</label>
                        <input type="number" step="0.01" id="formTaxa" placeholder="0.00">
                    </div>
                    <button class="btn-submit" id="btnSubmitForm" onclick="submeterFormulario()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL LISTA DE PEDIDOS DO DIA -->
    <div class="modal-overlay" id="modalListOverlay" onclick="fecharModalFora(event, 'modalListOverlay')">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalListTitulo">📦 Pedidos</h3>
                <button class="btn-modal-close" onclick="fecharModalList()">✕</button>
            </div>
            <div class="modal-body" id="modalListConteudo"></div>
        </div>
    </div>

    <!-- MODAL HISTÓRICO DE SEMANAS (GITHUB) -->
    <div class="modal-overlay" id="modalHistoryOverlay" onclick="fecharModalFora(event, 'modalHistoryOverlay')">
        <div class="modal-card modal-card-large">
            <div class="modal-header">
                <h3>📜 Semanas Guardadas no GitHub</h3>
                <button class="btn-modal-close" onclick="fecharModalHistorico()">✕</button>
            </div>
            <div class="modal-body">
                <div id="historyListArea">
                    <p style="color:var(--text-muted); text-align: center;">A carregar semanas do GitHub...</p>
                </div>
                <div id="historyDetailArea" style="display:none; margin-top: 15px;"></div>
            </div>
        </div>
    </div>

    <script>
        const diasSemana = [
            "Segunda-Feira", "Terça-Feira", "Quarta-Feira", 
            "Quinta-Feira", "Sexta-Feira", "Sábado", "Domingo"
        ];

        let registos = JSON.parse(localStorage.getItem('entregas_v2')) || [];
        let diaAtivo = null;
        let idEdicao = null;

        // Configuração Pré-Definida para o teu Repositório
        let ghConfig = JSON.parse(localStorage.getItem('gh_config')) || {
            user: 'goncalobrito',
            repo: 'goncalobrito.github.io',
            token: ''
        };

        /* --- DROPDOWN ENGRENAGEM --- */
        function toggleDropdown() {
            document.getElementById('dropdownMenu').classList.toggle('show');
        }

        function fecharDropdown() {
            document.getElementById('dropdownMenu').classList.remove('show');
        }

        window.onclick = function(event) {
            if (!event.target.matches('#btnDropdown')) {
                fecharDropdown();
            }
        }

        function calcularTotais(lista = registos) {
            let lucro = 0, adar = 0;
            lista.forEach(r => {
                const taxa = parseFloat(r.taxaEntrega) || 0;
                const valTaxas = (parseFloat(r.pagou) || 0) - (parseFloat(r.paguei) || 0);
                const valorAdar = valTaxas - taxa;

                lucro += taxa;
                adar += valorAdar;
            });
            return { lucro, adar, total: lucro + adar, count: lista.length };
        }

        function renderizar() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            const globais = calcularTotais(registos);
            document.getElementById('gloLucro').innerText = globais.lucro.toFixed(2) + '€';
            document.getElementById('gloAdar').innerText = globais.adar.toFixed(2) + '€';
            document.getElementById('gloTotal').innerText = globais.total.toFixed(2) + '€';

            diasSemana.forEach(dia => {
                const filtrados = registos.filter(r => r.dia === dia);
                const stats = calcularTotais(filtrados);

                grid.innerHTML += `
                    <div class="day-card">
                        <div class="day-header">
                            <span class="day-title">${dia}</span>
                            <span class="count-tag">${stats.count} pedidos</span>
                        </div>

                        <div class="day-stats">
                            <div class="stat-item">
                                <small>Lucro</small>
                                <b style="color: #fbbf24;">${stats.lucro.toFixed(2)}€</b>
                            </div>
                            <div class="stat-item">
                                <small>A Dar</small>
                                <b style="color: #f472b6;">${stats.adar.toFixed(2)}€</b>
                            </div>
                            <div class="stat-item">
                                <small>Total</small>
                                <b>${stats.total.toFixed(2)}€</b>
                            </div>
                        </div>

                        <div class="day-actions">
                            <button class="btn-action btn-plus" onclick="abrirModalForm('${dia}')">➕ Registar</button>
                            <button class="btn-action btn-eye" onclick="abrirModalList('${dia}')">👁</button>
                        </div>
                    </div>
                `;
            });

            localStorage.setItem('entregas_v2', JSON.stringify(registos));
        }

        /* --- API GITHUB --- */
        async function salvarFicheiroNoGithub(caminho, dadosObj, commitMsg) {
            if (!ghConfig.token || !ghConfig.user || !ghConfig.repo) return false;

            const url = `https://api.github.com/repos/${ghConfig.user}/${ghConfig.repo}/contents/${caminho}`;
            
            let sha = null;
            try {
                const resExist = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${ghConfig.token}` }
                });
                if (resExist.ok) {
                    const dataExist = await resExist.json();
                    sha = dataExist.sha;
                }
            } catch (e) {}

            const conteudoBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(dadosObj, null, 2))));
            const body = {
                message: commitMsg,
                content: conteudoBase64,
                ...(sha && { sha })
            };

            const response = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${ghConfig.token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });

            return response.ok;
        }

        async function sincronizarComGithub(silencioso = false) {
            if (!ghConfig.token) {
                if (!silencioso) abrirModalConfig();
                return;
            }

            try {
                const url = `https://api.github.com/repos/${ghConfig.user}/${ghConfig.repo}/contents/pedeja/dados_atuais.json`;
                const res = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${ghConfig.token}` }
                });

                if (res.ok) {
                    const data = await res.json();
                    const conteudo = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                    if (Array.isArray(conteudo)) {
                        registos = conteudo;
                        renderizar();
                        if (!silencioso) alert("Sincronizado com o GitHub com sucesso!");
                    }
                } else if (registos.length > 0) {
                    await salvarFicheiroNoGithub('pedeja/dados_atuais.json', registos, 'Atualização inicial de entregas');
                }
            } catch (e) {
                if (!silencioso) alert("Erro ao sincronizar. Confirma o teu Token no menu ⚙️.");
            }
        }

        async function autoSalvarNoGithub() {
            if (ghConfig.token) {
                await salvarFicheiroNoGithub('pedeja/dados_atuais.json', registos, 'Atualização de entregas');
            }
        }

        /* --- CONFIGURAÇÕES --- */
        function abrirModalConfig() {
            document.getElementById('cfgUser').value = ghConfig.user || 'goncalobrito';
            document.getElementById('cfgRepo').value = ghConfig.repo || 'goncalobrito.github.io';
            document.getElementById('cfgToken').value = ghConfig.token || '';
            document.getElementById('modalConfigOverlay').classList.add('active');
        }

        function fecharModalConfig() {
            document.getElementById('modalConfigOverlay').classList.remove('active');
        }

        function guardarConfiguracoes() {
            ghConfig.user = document.getElementById('cfgUser').value.trim();
            ghConfig.repo = document.getElementById('cfgRepo').value.trim();
            ghConfig.token = document.getElementById('cfgToken').value.trim();

            localStorage.setItem('gh_config', JSON.stringify(ghConfig));
            fecharModalConfig();
            alert("Configurações guardadas!");
            sincronizarComGithub();
        }

        /* --- FORMULÁRIO --- */
        function abrirModalForm(dia, indexEditar = null) {
            diaAtivo = dia;
            idEdicao = indexEditar;

            const modal = document.getElementById('modalFormOverlay');
            const titulo = document.getElementById('modalFormTitulo');
            const btnSubmit = document.getElementById('btnSubmitForm');

            if (indexEditar !== null) {
                const item = registos[indexEditar];
                titulo.innerText = `✏️ Editar Entrega (${dia})`;
                btnSubmit.innerText = "Atualizar Entrega";

                document.getElementById('formLocal').value = item.local;
                document.getElementById('formPagou').value = item.pagou;
                document.getElementById('formPaguei').value = item.paguei;
                document.getElementById('formTaxa').value = item.taxaEntrega;
            } else {
                titulo.innerText = `➕ Registar Entrega (${dia})`;
                btnSubmit.innerText = "Adicionar Entrega";
                limparFormulario();
            }

            modal.classList.add('active');
            setTimeout(() => document.getElementById('formLocal').focus(), 100);
        }

        function fecharModalForm() {
            document.getElementById('modalFormOverlay').classList.remove('active');
            limparFormulario();
            diaAtivo = null;
            idEdicao = null;
        }

        async function submeterFormulario() {
            const local = document.getElementById('formLocal').value.trim();
            const pagou = parseFloat(document.getElementById('formPagou').value) || 0;
            const paguei = parseFloat(document.getElementById('formPaguei').value) || 0;
            const taxaEntrega = parseFloat(document.getElementById('formTaxa').value) || 0;

            if (!local) {
                alert("Por favor, indica o nome do local.");
                return;
            }

            const payload = { dia: diaAtivo, local, pagou, paguei, taxaEntrega };

            if (idEdicao !== null) {
                registos[idEdicao] = payload;
            } else {
                registos.push(payload);
            }

            fecharModalForm();
            renderizar();
            await autoSalvarNoGithub();
        }

        function limparFormulario() {
            document.getElementById('formLocal').value = '';
            document.getElementById('formPagou').value = '';
            document.getElementById('formPaguei').value = '';
            document.getElementById('formTaxa').value = '';
        }

        /* --- LISTA DE PEDIDOS --- */
        function abrirModalList(dia) {
            diaAtivo = dia;
            document.getElementById('modalListTitulo').innerText = `📦 Pedidos de ${dia}`;
            renderizarListaDia(dia);
            document.getElementById('modalListOverlay').classList.add('active');
        }

        function fecharModalList() {
            document.getElementById('modalListOverlay').classList.remove('active');
            diaAtivo = null;
        }

        function renderizarListaDia(dia) {
            const entregas = registos.filter(r => r.dia === dia);
            const container = document.getElementById('modalListConteudo');

            if (entregas.length === 0) {
                container.innerHTML = `<p style="text-align:center; color: var(--text-muted); padding: 20px;">Nenhum pedido registado para este dia.</p>`;
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Local</th>
                            <th>Pagou</th>
                            <th>Paguei</th>
                            <th>Taxa</th>
                            <th>A Dar</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            entregas.forEach(r => {
                const indexReal = registos.indexOf(r);
                const valTaxas = r.pagou - r.paguei;
                const valAdar = valTaxas - r.taxaEntrega;

                html += `
                    <tr>
                        <td><b>${r.local}</b></td>
                        <td>${r.pagou.toFixed(2)}€</td>
                        <td>${r.paguei.toFixed(2)}€</td>
                        <td>${r.taxaEntrega.toFixed(2)}€</td>
                        <td style="color: #f472b6;"><b>${valAdar.toFixed(2)}€</b></td>
                        <td>
                            <button class="btn-tbl btn-tbl-edit" onclick="iniciarEdicaoViaModal(${indexReal})">✏️</button>
                            <button class="btn-tbl btn-tbl-del" onclick="removerRegisto(${indexReal})">🗑️</button>
                        </td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        function iniciarEdicaoViaModal(index) {
            const item = registos[index];
            fecharModalList();
            abrirModalForm(item.dia, index);
        }

        async function removerRegisto(index) {
            if (confirm("Tens a certeza que queres apagar este pedido?")) {
                const diaAtual = registos[index].dia;
                registos.splice(index, 1);
                renderizar();
                renderizarListaDia(diaAtual);
                await autoSalvarNoGithub();
            }
        }

        /* --- HISTÓRICO --- */
        async function abrirModalHistorico() {
            document.getElementById('modalHistoryOverlay').classList.add('active');
            document.getElementById('historyDetailArea').style.display = 'none';
            const listArea = document.getElementById('historyListArea');
            listArea.style.display = 'block';

            if (!ghConfig.token) {
                listArea.innerHTML = `
                    <p style="color:var(--text-muted); text-align:center;">Configura o Token na engrenagem ⚙️ para consultar as semanas do GitHub.</p>
                `;
                return;
            }

            listArea.innerHTML = `<p style="color:var(--text-muted); text-align: center;">A carregar semanas do GitHub...</p>`;

            try {
                const url = `https://api.github.com/repos/${ghConfig.user}/${ghConfig.repo}/contents/pedeja/historico`;
                const res = await fetch(url, { headers: { 'Authorization': `Bearer ${ghConfig.token}` } });
                
                if (!res.ok) {
                    listArea.innerHTML = `<p style="color:var(--text-muted); text-align:center;">Ainda não tens semanas arquivadas.</p>`;
                    return;
                }

                const ficheiros = await res.json();
                const jsonFiles = ficheiros.filter(f => f.name.endsWith('.json'));

                if (jsonFiles.length === 0) {
                    listArea.innerHTML = `<p style="color:var(--text-muted); text-align:center;">Nenhum registo encontrado na pasta historico.</p>`;
                    return;
                }

                let html = `<h4 style="margin-bottom:12px;">Semanas Arquivadas:</h4>`;
                jsonFiles.forEach(f => {
                    const nomeFormatado = f.name.replace('semana_', 'Semana ').replace('.json', '').replace(/_/g, '/');
                    html += `
                        <div class="history-list-item">
                            <span>📅 <b>${nomeFormatado}</b></span>
                            <button class="nav-btn nav-btn-history" onclick="carregarDetalheSemana('${f.path}')">Ver Detalhes</button>
                        </div>
                    `;
                });

                listArea.innerHTML = html;
            } catch (e) {
                listArea.innerHTML = `<p style="color:var(--accent-danger); text-align:center;">Erro ao ligar ao repositório do GitHub.</p>`;
            }
        }

        async function carregarDetalheSemana(path) {
            const detailArea = document.getElementById('historyDetailArea');
            const listArea = document.getElementById('historyListArea');

            try {
                const url = `https://api.github.com/repos/${ghConfig.user}/${ghConfig.repo}/contents/${path}`;
                const res = await fetch(url, { headers: { 'Authorization': `Bearer ${ghConfig.token}` } });
                const fileData = await res.json();
                const dados = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));

                const lista = Array.isArray(dados) ? dados : (dados.registos || []);
                const semanaFim = dados.semana_fim || path;
                const totais = calcularTotais(lista);

                listArea.style.display = 'none';
                detailArea.style.display = 'block';

                let html = `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                        <button class="nav-btn" onclick="voltarParaListaHistorico()">⬅️ Voltar à Lista</button>
                        <button class="nav-btn" style="background:#2563eb; color:#fff;" onclick='restaurarSemanaHistorico(${JSON.stringify(lista)})'>
                            🔄 Restaurar para o Painel
                        </button>
                    </div>

                    <div style="background:#0f172a; padding:15px; border-radius:10px; border:1px solid var(--card-border); margin-bottom:15px; display:flex; justify-content:space-around; text-align:center;">
                        <div><small style="color:var(--text-muted);">Semana</small><br><b>${semanaFim}</b></div>
                        <div><small style="color:var(--text-muted);">Lucro</small><br><b style="color:#fbbf24;">${totais.lucro.toFixed(2)}€</b></div>
                        <div><small style="color:var(--text-muted);">A Dar</small><br><b style="color:#f472b6;">${totais.adar.toFixed(2)}€</b></div>
                        <div><small style="color:var(--text-muted);">Total</small><br><b>${totais.total.toFixed(2)}€</b></div>
                    </div>

                    <div style="max-height:220px; overflow-y:auto;">
                        <table>
                            <thead>
                                <tr><th>Dia</th><th>Local</th><th>Pagou</th><th>Paguei</th><th>Taxa</th><th>A Dar</th></tr>
                            </thead>
                            <tbody>
                `;

                lista.forEach(r => {
                    const valTaxas = (r.pagou || 0) - (r.paguei || 0);
                    const valAdar = valTaxas - (r.taxaEntrega || 0);
                    html += `
                        <tr>
                            <td><b>${r.dia}</b></td>
                            <td>${r.local}</td>
                            <td>${r.pagou.toFixed(2)}€</td>
                            <td>${r.paguei.toFixed(2)}€</td>
                            <td>${r.taxaEntrega.toFixed(2)}€</td>
                            <td style="color:#f472b6;">${valAdar.toFixed(2)}€</td>
                        </tr>
                    `;
                });

                html += `</tbody></table></div>`;
                detailArea.innerHTML = html;
            } catch (e) {
                alert("Erro ao abrir os detalhes desta semana.");
            }
        }

        async function restaurarSemanaHistorico(lista) {
            if (confirm("Desejas colocar os registos desta semana no teu painel principal ativo?")) {
                registos = lista;
                renderizar();
                await autoSalvarNoGithub();
                fecharModalHistorico();
                alert("Semana restaurada no painel e sincronizada no GitHub!");
            }
        }

        function voltarParaListaHistorico() {
            document.getElementById('historyDetailArea').style.display = 'none';
            document.getElementById('historyListArea').style.display = 'block';
        }

        function fecharModalHistorico() {
            document.getElementById('modalHistoryOverlay').classList.remove('active');
        }

        /* --- FECHAR SEMANA --- */
        function obterDataFimSemana() {
            const hoje = new Date();
            const diaSemana = hoje.getDay(); 
            const diasAteDomingo = (diaSemana === 0) ? 0 : (7 - diaSemana);
            
            const domingo = new Date(hoje);
            domingo.setDate(hoje.getDate() + diasAteDomingo);

            const dia = String(domingo.getDate()).padStart(2, '0');
            const mes = String(domingo.getMonth() + 1).padStart(2, '0');
            const ano = domingo.getFullYear();

            return {
                formatadoLegivel: `${dia}/${mes}/${ano}`,
                formatadoFicheiro: `${dia}_${mes}_${ano}`
            };
        }

        async function fecharSemana() {
            if (registos.length === 0) {
                alert("Não existem dados registados para fechar a semana.");
                return;
            }

            const dataSemana = obterDataFimSemana();
            const confirmacao = confirm(
                `Fechar a semana de ${dataSemana.formatadoLegivel}?\n\n` +
                `Os dados serão arquivados no GitHub e o painel voltará a zeros.`
            );

            if (!confirmacao) return;

            const totais = calcularTotais(registos);
            const relatorioHistorico = {
                semana_fim: dataSemana.formatadoLegivel,
                resumo: {
                    lucro_total: totais.lucro.toFixed(2) + "€",
                    valor_a_dar_total: totais.adar.toFixed(2) + "€",
                    balanco_geral: totais.total.toFixed(2) + "€",
                    total_pedidos: totais.count
                },
                registos: registos
            };

            // 1. Arquivar no GitHub
            const caminhoHist = `pedeja/historico/semana_${dataSemana.formatadoFicheiro}.json`;
            await salvarFicheiroNoGithub(caminhoHist, relatorioHistorico, `Arquivo Semana ${dataSemana.formatadoLegivel}`);

            // 2. Limpar dados atuais
            registos = [];
            localStorage.removeItem('entregas_v2');
            await salvarFicheiroNoGithub('pedeja/dados_atuais.json', [], 'Reset de início de semana');

            renderizar();
            alert(`Semana fechada e guardada no GitHub com sucesso!`);
        }

        /* --- IMPORTAR / EXPORTAR LOCAL (.JSON) --- */
        function exportarFicheiroLocal() {
            if (registos.length === 0) {
                alert("Não existem registos para exportar.");
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(registos, null, 2));
            const a = document.createElement('a');
            a.setAttribute("href", dataStr);
            a.setAttribute("download", "entregas_backup.json");
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        function importarFicheiroLocal(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const dados = JSON.parse(e.target.result);
                    const lista = Array.isArray(dados) ? dados : (dados.registos || null);
                    
                    if (lista && Array.isArray(lista)) {
                        registos = lista;
                        renderizar();
                        await autoSalvarNoGithub();
                        alert("Dados importados e sincronizados com sucesso!");
                    } else {
                        alert("Formato de ficheiro não reconhecido.");
                    }
                } catch (err) {
                    alert("Erro ao ler o ficheiro JSON.");
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function fecharModalFora(e, overlayId) {
            if (e.target.id === overlayId) {
                document.getElementById(overlayId).classList.remove('active');
            }
        }

        // Inicialização
        renderizar();
        if (ghConfig.token) {
            sincronizarComGithub(true);
        }
    </script>
</body>
</html>
