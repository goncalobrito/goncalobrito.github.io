<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Quinta Isométrica — Turbo Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Exo+2:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #060d1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-wrapper {
            position: relative;
            width: 1000px;
            height: 750px;
        }
        canvas {
            display: block;
            border-radius: 12px;
            box-shadow: 0 0 0 2px rgba(34,211,238,0.3), 0 0 40px rgba(34,211,238,0.12), 0 20px 50px rgba(0,0,0,0.8);
        }
        #toasts {
            position: absolute;
            top: 16px; right: 16px;
            display: flex; flex-direction: column; gap: 8px;
            z-index: 100; pointer-events: none;
        }
        .toast {
            background: rgba(6,13,26,0.96);
            border: 1px solid rgba(34,211,238,0.3);
            border-left: 3px solid #22d3ee;
            border-radius: 8px;
            padding: 9px 14px;
            color: #e2e8f0;
            font-family: 'Exo 2', sans-serif;
            font-size: 13px; font-weight: 700;
            animation: tIn 0.25s ease forwards;
            white-space: nowrap;
        }
        .toast.ok  { border-left-color: #4ade80; }
        .toast.war { border-left-color: #facc15; }
        .toast.err { border-left-color: #f87171; }
        @keyframes tIn  { from { opacity:0; transform:translateX(16px); } to { opacity:1; transform:translateX(0); } }
        @keyframes tOut { from { opacity:1; } to { opacity:0; transform:translateX(16px); } }
        .coin-pop {
            position: absolute;
            font-family: 'Exo 2', sans-serif;
            font-size: 17px; font-weight: 900;
            color: #facc15;
            text-shadow: 0 0 10px rgba(250,204,21,0.7);
            pointer-events: none;
            animation: cpop 1s ease forwards;
        }
        @keyframes cpop { 0%{opacity:1;transform:translateY(0) scale(1);} 100%{opacity:0;transform:translateY(-55px) scale(1.2);} }
        #growbar {
            position: absolute;
            bottom: 14px; left: 50%; transform: translateX(-50%);
            width: 280px;
            background: rgba(6,13,26,0.82);
            border: 1px solid rgba(34,211,238,0.25);
            border-radius: 20px;
            padding: 5px 12px;
            display: flex; align-items: center; gap: 10px;
            pointer-events: none;
        }
        #growbar span { font-family:'Exo 2',sans-serif; font-size:11px; font-weight:700; color:#64748b; white-space:nowrap; }
        #growtrack { flex:1; height:7px; background:rgba(255,255,255,0.08); border-radius:10px; overflow:hidden; }
        #growfill  { height:100%; background: linear-gradient(90deg,#4ade80,#22d3ee); border-radius:10px; width:0%; transition:width 0.15s linear; box-shadow:0 0 6px rgba(74,222,128,0.5); }
    </style>
</head>
<body>
<div id="game-wrapper">
    <div id="toasts"></div>
    <div id="growbar"><span>🌱 Próximo ciclo</span><div id="growtrack"><div id="growfill"></div></div></div>
</div>
<script>
// ─── TOAST / POPUP ───────────────────────────────────────────────
function toast(msg, tipo, dur) {
    dur = dur || 2500;
    var c = document.getElementById('toasts');
    var el = document.createElement('div');
    el.className = 'toast ' + (tipo || '');
    el.textContent = msg;
    c.appendChild(el);
    setTimeout(function() {
        el.style.animation = 'tOut 0.3s ease forwards';
        setTimeout(function() { el.remove(); }, 300);
    }, dur);
}

function coinPop(canvas, sx, sy, val) {
    var wrap = document.getElementById('game-wrapper');
    var r = canvas.getBoundingClientRect();
    var wr = wrap.getBoundingClientRect();
    var el = document.createElement('div');
    el.className = 'coin-pop';
    el.textContent = '+' + val + '€';
    el.style.left = (sx + r.left - wr.left) + 'px';
    el.style.top  = (sy + r.top  - wr.top)  + 'px';
    wrap.appendChild(el);
    setTimeout(function() { el.remove(); }, 1000);
}

// ─── ESTADO GLOBAL ───────────────────────────────────────────────
var G = {
    moedas: 250,
    nivelTrator: 1,
    velTrator: 155,
    plantas: null,
    desbloq: null,
    rega: null,
    tipo: null,
    colheitas: 0,
    expansoes: 0,
    dia: 1,
    regaRestante: 5,
    sementeAtiva: 'girassol',
    bonusColheita: 1,
    upgradeOuro: false,
    aduboRestante: 2,
    combo: 0,
    maxCombo: 0,
    ultimaColheita: 0,
    eventoDia: null,
    missoes: null,
    aspersores: 0,
    silos: 0,
    empregados: 0,
    celeiroNv: 0,
    estufa: false,
    ouroNv: 0,
    eliteSem: null,
    totalGasto: 0
};

var CULTURAS = {
    girassol: { emoji: '🌻', nome: 'Girassol', ganho: 65,  custoPlantio: 18,  extraCiclo: 0, fruto: 0xf97316 },
    milho:    { emoji: '🌽', nome: 'Milho',    ganho: 110, custoPlantio: 32,  extraCiclo: -1, fruto: 0xfde047 },
    morango:  { emoji: '🍓', nome: 'Morango',  ganho: 45,  custoPlantio: 12,  extraCiclo: 1, fruto: 0xef4444 },
    lavanda:  { emoji: '💜', nome: 'Lavanda',  ganho: 320, custoPlantio: 95,  extraCiclo: 0, fruto: 0xa78bfa, requerEstufa: true }
};
var ORDEM_SEMENTES_BASE = ['girassol', 'milho', 'morango'];
var CUSTO_UPGRADE  = 500;
var CUSTO_UPGRADE_OURO = 350;

function ordemSementes() {
    var o = ORDEM_SEMENTES_BASE.slice();
    if (G.estufa) o.push('lavanda');
    return o;
}

function custoExpansao() {
    return Math.floor(180 * Math.pow(2.05, G.expansoes));
}

function custoPlantio(tipo) {
    var c = CULTURAS[tipo];
    if (!c) return 99;
    var v = c.custoPlantio;
    if (G.eliteSem && G.eliteSem[tipo]) v = Math.floor(v * 0.75);
    return v;
}

function getCatalogoLoja() {
    return LOJA_CATALOGO.filter(function(it) {
        if (it.requer && !it.requer()) return false;
        if (it.max !== undefined && nivelLoja(it.id) >= it.max) return it.mostrarMax !== false;
        return true;
    });
}

function nivelLoja(id) {
    if (id === 'trator2') return G.nivelTrator >= 2 ? 1 : 0;
    if (id === 'trator3') return G.nivelTrator >= 3 ? 1 : 0;
    if (id === 'ouro') return G.ouroNv >= 1 ? 1 : 0;
    if (id === 'ouro2') return G.ouroNv >= 2 ? 1 : 0;
    if (id === 'aspersor') return G.aspersores;
    if (id === 'silo') return G.silos;
    if (id === 'empregado') return G.empregados;
    if (id === 'celeiro') return G.celeiroNv;
    if (id === 'estufa') return G.estufa ? 1 : 0;
    if (id === 'elite') return G.eliteSem && G.eliteSem[G.sementeAtiva] ? 1 : 0;
    return 0;
}

function custoLojaItem(it) {
    var nv = nivelLoja(it.id);
    if (nv >= it.max) return null;
    return Math.floor(it.custoBase * Math.pow(it.mult || 1, nv));
}

function aplicarBonusColheita() {
    var b = 1;
    if (G.ouroNv >= 1) b *= 1.35;
    if (G.ouroNv >= 2) b *= 1.25;
    G.bonusColheita = b;
    G.upgradeOuro = G.ouroNv >= 1;
}

function comprarLojaItem(id) {
    var it = null;
    LOJA_CATALOGO.forEach(function(x) { if (x.id === id) it = x; });
    if (!it) return false;
    var nv = nivelLoja(id);
    if (nv >= it.max) { toast('✅ Já no máximo!', 'war'); return false; }
    if (it.requer && !it.requer()) { toast('🔒 Requisito em falta', 'err'); return false; }
    var custo = custoLojaItem(it);
    if (G.moedas < custo) {
        toast('❌ Precisas de ' + custo + '€ (tens ' + G.moedas + '€)', 'err');
        return false;
    }
    G.moedas -= custo;
    G.totalGasto = (G.totalGasto || 0) + custo;
    it.aplicar();
    aplicarBonusColheita();
    progMissao('gastar', custo);
    progMissao('riqueza', 0);
    guardarJogo();
    toast(it.emoji + ' ' + it.nome + ' comprado! (-' + custo + '€)', 'ok', 3000);
    return true;
}

var LOJA_CATALOGO = [
    { id: 'trator2', emoji: '🚜', nome: 'Trator Turbo', max: 1, custoBase: 500, mult: 1,
      desc: 'Velocidade 2×', requer: function() { return G.nivelTrator < 2; },
      aplicar: function() { G.nivelTrator = 2; G.velTrator = 75; } },
    { id: 'ouro', emoji: '✨', nome: 'Colheita Ouro', max: 1, custoBase: 350, mult: 1,
      desc: '+35% valor colheitas', requer: function() { return G.ouroNv < 1; },
      aplicar: function() { G.ouroNv = 1; } },
    { id: 'aspersor', emoji: '💦', nome: 'Aspersor', max: 6, custoBase: 1400, mult: 1.85,
      desc: 'Rega automática no ciclo', aplicar: function() { G.aspersores++; } },
    { id: 'silo', emoji: '🏗️', nome: 'Silo', max: 5, custoBase: 2800, mult: 2.1,
      desc: '+200€ rendimento/dia', aplicar: function() { G.silos++; } },
    { id: 'empregado', emoji: '👨‍🌾', nome: 'Empregado', max: 4, custoBase: 5000, mult: 2.3,
      desc: 'Colhe 1 planta/ciclo', aplicar: function() { G.empregados++; } },
    { id: 'estufa', emoji: '🏠', nome: 'Estufa', max: 1, custoBase: 12000, mult: 1,
      desc: 'Desbloqueia lavanda 💜', requer: function() { return !G.estufa; },
      aplicar: function() { G.estufa = true; } },
    { id: 'ouro2', emoji: '👑', nome: 'Colheita Ouro II', max: 1, custoBase: 10000, mult: 1,
      desc: '+25% extra nas colheitas', requer: function() { return G.ouroNv >= 1 && G.ouroNv < 2; },
      aplicar: function() { G.ouroNv = 2; } },
    { id: 'trator3', emoji: '🚀', nome: 'Trator Hiper', max: 1, custoBase: 18000, mult: 1,
      desc: 'Velocidade 3×', requer: function() { return G.nivelTrator >= 2 && G.nivelTrator < 3; },
      aplicar: function() { G.nivelTrator = 3; G.velTrator = 48; } },
    { id: 'celeiro', emoji: '🌾', nome: 'Celeiro', max: 4, custoBase: 7500, mult: 2.4,
      desc: '+500€ rendimento/dia', aplicar: function() { G.celeiroNv++; } },
    { id: 'elite', emoji: '⭐', nome: 'Sementes Elite', max: 1, custoBase: 4500, mult: 1,
      desc: '+30% ganho cultura atual', requer: function() { return !(G.eliteSem && G.eliteSem[G.sementeAtiva]); },
      aplicar: function() {
          if (!G.eliteSem) G.eliteSem = {};
          G.eliteSem[G.sementeAtiva] = true;
      } }
];

function guardarJogo() {
    try {
        localStorage.setItem('quintaSave', JSON.stringify({
            moedas: G.moedas, nivelTrator: G.nivelTrator, velTrator: G.velTrator,
            plantas: G.plantas, desbloq: G.desbloq, rega: G.rega, tipo: G.tipo,
            colheitas: G.colheitas, expansoes: G.expansoes, dia: G.dia,
            regaRestante: G.regaRestante, sementeAtiva: G.sementeAtiva,
            bonusColheita: G.bonusColheita, upgradeOuro: G.upgradeOuro, ouroNv: G.ouroNv,
            aduboRestante: G.aduboRestante, combo: G.combo, maxCombo: G.maxCombo,
            eventoDia: G.eventoDia, missoes: G.missoes,
            aspersores: G.aspersores, silos: G.silos, empregados: G.empregados,
            celeiroNv: G.celeiroNv, estufa: G.estufa, eliteSem: G.eliteSem, totalGasto: G.totalGasto
        }));
    } catch (e) {}
}

function carregarJogo() {
    try {
        var raw = localStorage.getItem('quintaSave');
        if (!raw) return false;
        var s = JSON.parse(raw);
        Object.keys(s).forEach(function(k) { if (s[k] !== undefined) G[k] = s[k]; });
        return true;
    } catch (e) { return false; }
}

function initMissoes() {
    G.missoes = [
        { id: 'colheitas', desc: 'Colher 8 plantas', alvo: 8, prog: 0, premio: 150, feita: false },
        { id: 'expandir',  desc: 'Expandir 3 parcelas', alvo: 3, prog: 0, premio: 200, feita: false },
        { id: 'riqueza',   desc: 'Acumular 2000€', alvo: 2000, prog: 0, premio: 120, feita: false },
        { id: 'gastar',    desc: 'Gastar 8000€ na loja', alvo: 8000, prog: 0, premio: 500, feita: false }
    ];
}

function progMissao(id, n) {
    if (!G.missoes) return;
    G.missoes.forEach(function(m) {
        if (m.feita || m.id !== id) return;
        if (id === 'riqueza') m.prog = G.moedas;
        else if (id === 'gastar') m.prog = Math.min(m.alvo, G.totalGasto || 0);
        else m.prog = Math.min(m.alvo, m.prog + (n || 1));
        if (m.prog >= m.alvo) {
            m.feita = true;
            G.moedas += m.premio;
            toast('🎯 Missão: ' + m.desc + ' (+' + m.premio + '€)', 'ok', 4000);
        }
    });
    guardarJogo();
}

function novoEventoDia() {
    var lista = [
        { msg: '☀️ Sol forte — ciclos 25% mais rápidos', cicloMult: 0.75, ganhoMult: 1, rega: 5 },
        { msg: '🌧️ Chuva — +3 regas extra', cicloMult: 1, ganhoMult: 1, rega: 3 },
        { msg: '🎪 Feira — colheitas +50%', cicloMult: 1, ganhoMult: 1.5, rega: 0 },
        { msg: '🌙 Dia calmo', cicloMult: 1, ganhoMult: 1, rega: 0 }
    ];
    G.eventoDia = lista[Phaser.Math.Between(0, lista.length - 1)];
}

function ganhoColheita(tx, ty) {
    var tipo = G.tipo[tx][ty] || 'girassol';
    var base = CULTURAS[tipo].ganho;
    if (G.eliteSem && G.eliteSem[tipo]) base = Math.round(base * 1.3);
    var ev = (G.eventoDia && G.eventoDia.ganhoMult) || 1;
    return Math.round(base * G.bonusColheita * ev);
}

function autoRegaAspersores(scene) {
    if (!G.aspersores) return;
    var n = 0;
    for (var a = 0; a < G.aspersores && n < 20; a++) {
        var x = Phaser.Math.Between(0, COLS - 1);
        var y = Phaser.Math.Between(0, ROWS - 1);
        if (!G.desbloq[x][y] || G.plantas[x][y] === 0 || G.plantas[x][y] >= 5 || G.rega[x][y]) continue;
        G.rega[x][y] = true;
        scene.drawTile(x, y);
        n++;
    }
}

function autoColheitaEmpregados(scene, t) {
    if (!G.empregados) return;
    var colhidas = 0;
    for (var e = 0; e < G.empregados && colhidas < e; e++) {
        for (var x = 0; x < COLS; x++) {
            var found = false;
            for (var y = 0; y < ROWS; y++) {
                if (G.desbloq[x][y] && G.plantas[x][y] >= 5 && !(x === 0 && y === 0)) {
                    var ganho = ganhoColheita(x, y);
                    G.plantas[x][y] = 0;
                    G.tipo[x][y] = '';
                    G.moedas += ganho;
                    G.colheitas++;
                    scene.drawTile(x, y);
                    colhidas++;
                    found = true;
                    break;
                }
            }
            if (found) break;
        }
    }
    if (colhidas > 0) scene.updateUI();
}

// ─── MÁQUINA DE ESTADOS (campo ↔ loja) ───────────────────────────
var Estado = { CAMPO: 'campo', LOJA: 'loja' };

var MaquinaEstados = {
    atual: Estado.CAMPO,

    mudar: function(novo) {
        this.atual = novo;
        var grow = document.getElementById('growbar');
        if (grow) grow.style.display = (novo === Estado.CAMPO) ? 'flex' : 'none';
    },

    esta: function(e) { return this.atual === e; },
    podeConduzir: function() { return this.atual === Estado.CAMPO; },

    irLoja: function(game) {
        if (this.atual === Estado.LOJA) return;
        this.mudar(Estado.LOJA);
        game.scene.start('CenaLoja');
    },

    irCampo: function(game, fromShop) {
        if (this.atual === Estado.CAMPO) return;
        this.mudar(Estado.CAMPO);
        if (game.scene.isActive('CenaLoja')) {
            game.scene.stop('CenaLoja');
        }
        game.scene.start('CenaQuinta', { fromShop: !!fromShop });
    }
};

var TAM  = 42;
var COLS = 10;
var ROWS = 10;
var CICLO_MS      = 2200;
var GANHO_COLHEITA = 65;
// ─── PALETA ──────────────────────────────────────────────────────
const COR = {
    terra:       0x1a3a1a,
    herva:       0x22c55e, // Corrigido erro ortográfico de "herva"
    semente:     0x451a03,
    broto:       0x65a30d,
    crescendo:   0x84cc16,
    maduro:      0xa3e635,
    colhivel:    0xfacc15,
    bloqueado:   0x1e293b,
    loja:        0x164e63,
    regado:      0x0ea5e9,
};

// ─── CENA QUINTA ─────────────────────────────────────────────────
var CenaQuinta = new Phaser.Class({
    Extends: Phaser.Scene,
    initialize: function() { Phaser.Scene.call(this, { key: 'CenaQuinta' }); },

    create: function(data) {
        var self = this;
        MaquinaEstados.mudar(Estado.CAMPO);
        if (this.game.canvas) {
            this.game.canvas.setAttribute('tabindex', '1');
            this.game.canvas.focus();
        }
        this.keys = this.input.keyboard.createCursorKeys();
        this.kSpace = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
        this.kE     = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.E);
        this.kR     = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.R);
        this.kN     = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.N);
        this.kQ     = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.Q);
        this.kU     = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.U);

        if (!carregarJogo()) {
            G.eventoDia = { msg: '🌅 Bem-vindo à quinta', cicloMult: 1, ganhoMult: 1, rega: 0 };
            initMissoes();
        }
        if (!G.missoes) initMissoes();
        if (!G.eventoDia) novoEventoDia();
        if (G.plantas && !G.tipo) {
            G.tipo = [];
            for (var xi = 0; xi < COLS; xi++) {
                G.tipo[xi] = [];
                for (var yi = 0; yi < ROWS; yi++) {
                    G.tipo[xi][yi] = G.plantas[xi][yi] > 0 ? 'girassol' : '';
                }
            }
        }
        if (!G.eliteSem) G.eliteSem = {};
        if (G.upgradeOuro && !G.ouroNv) G.ouroNv = 1;
        aplicarBonusColheita();
        if (!G.totalGasto) G.totalGasto = 0;
        G.aspersores = G.aspersores || 0;
        G.silos = G.silos || 0;
        G.empregados = G.empregados || 0;
        G.celeiroNv = G.celeiroNv || 0;
        G.ouroNv = G.ouroNv || 0;
        G.estufa = !!G.estufa;

        this.terreno  = [];
        this.gTiles   = [];
        this.gDetail  = [];
        this.tLogico  = (data && data.fromShop) ? { x: 2, y: 0 } : { x: 3, y: 3 };
        this._cooldownLojaAte = (data && data.fromShop) ? this.time.now + 2500 : 0;

        // Init matrizes
        if (!G.plantas) {
            G.plantas = []; G.desbloq = []; G.rega = []; G.tipo = [];
            for (var x = 0; x < COLS; x++) {
                G.plantas[x] = []; G.desbloq[x] = []; G.rega[x] = []; G.tipo[x] = [];
                for (var y = 0; y < ROWS; y++) {
                    G.desbloq[x][y]  = (x < 5 && y < 5);
                    G.plantas[x][y]  = (G.desbloq[x][y] && Phaser.Math.Between(0,3)===1) ? 1 : 0;
                    G.rega[x][y]     = false;
                    G.tipo[x][y]     = G.plantas[x][y] > 0 ? 'girassol' : '';
                }
            }
        }

        // Fundo
        this.add.rectangle(500, 375, 1000, 750, 0x060d1a);

        // Tiles
        for (var x = 0; x < COLS; x++) {
            this.terreno[x] = []; this.gTiles[x] = []; this.gDetail[x] = [];
            for (var y = 0; y < ROWS; y++) {
                var h = Math.sin(x*0.55) * Math.cos(y*0.55) * 22;
                this.terreno[x][y] = h;
                var p = this.iso(x, y);

                var t = this.add.graphics();
                t.setPosition(p.x, p.y - h);
                t.depth = (x + y) * 10;
                this.gTiles[x][y] = t;

                var d = this.add.graphics();
                d.setPosition(p.x, p.y - h);
                d.depth = (x + y) * 10 + 1;
                this.gDetail[x][y] = d;

                this.drawTile(x, y);
            }
        }

        // Label loja
        var pl = this.iso(0, 0);
        var lbl = this.add.text(pl.x, pl.y - this.terreno[0][0] - 38, '▲ STAND', {
            fontFamily: "'Exo 2',sans-serif", fontSize: '11px', fontStyle: 'bold',
            color: '#22d3ee', backgroundColor: '#060d1acc', padding: { x:5, y:3 }
        }).setOrigin(0.5).setDepth(9999);
        this.tweens.add({ targets: lbl, alpha: 0.3, duration: 900, yoyo: true, repeat: -1 });

        // Trator
        this.trCont  = this.add.container(0, 0).setDepth(9995);
        this.trShadow = this.add.graphics();
        this.trGfx    = this.add.graphics();
        this.trCont.add([this.trShadow, this.trGfx]);
        this.drawTrator();

        var z0 = this.terreno[this.tLogico.x][this.tLogico.y];
        var p0 = this.iso(this.tLogico.x, this.tLogico.y);
        this.alvoX = p0.x; this.alvoY = p0.y - z0;
        this.trCont.setPosition(this.alvoX, this.alvoY);

        // Cursor
        this.cursor = this.add.graphics().setDepth(9994);
        this._ct = 0;

        // UI painel fundo
        var ui = this.add.graphics().setDepth(99990);
        ui.fillStyle(0x060d1a, 0.9); ui.lineStyle(1, 0x22d3ee, 0.3);
        ui.fillRoundedRect(10, 10, 285, 128, 10);
        ui.strokeRoundedRect(10, 10, 285, 128, 10);

        this.txtUI = this.add.text(20, 20, '', {
            fontFamily: "'Exo 2',sans-serif", fontSize: '13px', fontStyle: 'bold',
            color: '#e2e8f0', lineSpacing: 6
        }).setDepth(99991);

        // Painel controlos
        var ct = this.add.graphics().setDepth(99990);
        ct.fillStyle(0x060d1a, 0.8); ct.lineStyle(1, 0x1e293b, 0.6);
        ct.fillRoundedRect(10, 130, 285, 175, 10);
        ct.strokeRoundedRect(10, 130, 285, 175, 10);
        this.add.text(20, 140, [
            '   ⌨  CONTROLOS',
            '─────────────────────────',
            '  [SETAS]  Mover trator',
            '  [ESPAÇO]  Semear / Colher',
            '  [Q]  Semente  [U]  Adubo  [E]  Expandir €↑',
            '  [0,0] Stand — gasta o dinheiro!',
            '  [N]  Dia seguinte  [0,0] Stand',
        ].join('\n'), {
            fontFamily: "'Exo 2',sans-serif", fontSize: '11px',
            color: '#475569', lineSpacing: 5
        }).setDepth(99991);

        var mp = this.add.graphics().setDepth(99990);
        mp.fillStyle(0x060d1a, 0.88); mp.lineStyle(1, 0xfacc15, 0.35);
        mp.fillRoundedRect(700, 10, 290, 155, 10);
        mp.strokeRoundedRect(700, 10, 290, 155, 10);
        this.txtMissoes = this.add.text(715, 22, '', {
            fontFamily: "'Exo 2',sans-serif", fontSize: '11px',
            color: '#94a3b8', lineSpacing: 5
        }).setDepth(99991);

        this._cicloInicio  = this.time.now;
        this._proximoCiclo = this.time.now + CICLO_MS;
        this._proximoMov   = 0;

        this.updateUI();
        if (data && data.fromShop) {
            toast('🚜 Campo — podes conduzir outra vez!', 'ok', 2500);
        } else {
            toast('🌻 Bem-vindo à Quinta! Boa colheita!', 'ok', 3000);
        }
    },

    iso: function(gx, gy) {
        var ox = 500, oy = 200;
        return {
            x: ox + (gx - gy) * TAM,
            y: oy + (gx + gy) * (TAM * 0.5)
        };
    },

    drawTrator: function() {
        this.trShadow.clear();
        this.trShadow.fillStyle(0x000000, 0.22);
        this.trShadow.fillEllipse(0, 16, 36, 12);

        this.trGfx.clear();
        var cor = G.nivelTrator === 1 ? 0xef4444 : (G.nivelTrator === 3 ? 0x8b5cf6 : 0xeab308);

        this.trGfx.fillStyle(0x111827, 1);
        this.trGfx.fillCircle(-13, 5, 9);
        this.trGfx.fillCircle(13, 5, 9);
        this.trGfx.fillStyle(0x374151, 1);
        this.trGfx.fillCircle(-13, 5, 5);
        this.trGfx.fillCircle(13, 5, 5);
        this.trGfx.fillStyle(cor, 1);
        this.trGfx.fillRoundedRect(-14, -27, 28, 30, 5);
        this.trGfx.fillStyle(0x22d3ee, 0.9);
        this.trGfx.fillRoundedRect(-8, -22, 16, 11, 3);
        this.trGfx.fillStyle(0xffffff, 0.3);
        this.trGfx.fillRect(-7, -21, 5, 4);
        this.trGfx.fillStyle(0x1f2937, 1);
        this.trGfx.fillRect(8, -33, 4, 9);
        if (G.nivelTrator >= 2) {
            this.trGfx.fillStyle(0xf97316, 1);
            this.trGfx.fillCircle(10, -34, 3);
        }
        if (G.nivelTrator >= 3) {
            this.trGfx.fillStyle(0x8b5cf6, 1);
            this.trGfx.fillRect(-16, -30, 4, 8);
            this.trGfx.fillRect(12, -30, 4, 8);
        }
    },

    drawTile: function(x, y) {
        var t  = this.gTiles[x][y];
        var d  = this.gDetail[x][y];
        if (!t || !d) return;
        t.clear(); d.clear();

        var isShop  = (x === 0 && y === 0);
        var unlock  = G.desbloq[x][y];
        var estado  = G.plantas[x][y];
        var regado  = G.rega[x][y];

        var cTop, cL, cR, al = 1;

        if (isShop) {
            cTop = 0x164e63; cL = 0x0e3a4a; cR = 0x0a2c38;
        } else if (!unlock) {
            cTop = 0x1a2535; cL = 0x111c28; cR = 0x0d1620; al = 0.8;
        } else {
            var paleta = [
                [COR.herva,     0x15803d, 0x0f6028], // Corrigido para COR.herva
                [COR.semente,   0x3a1501, 0x2d1001],
                [COR.broto,     0x4d7c0f, 0x3a5e09],
                [COR.crescendo, 0x65a30d, 0x4f7c0a],
                [COR.maduro,    0x84cc16, 0x65a30d],
                [COR.colhivel,  0xca8a04, 0x9a6703],
            ];
            var c = paleta[Math.min(estado, 5)];
            cTop = c[0]; cL = c[1]; cR = c[2];
        }

        t.fillStyle(cTop, al);
        t.beginPath();
        t.moveTo(0, -TAM*0.5); t.lineTo(TAM, 0); t.lineTo(0, TAM*0.5); t.lineTo(-TAM, 0);
        t.closePath(); t.fillPath();

        t.fillStyle(cL, al);
        t.beginPath();
        t.moveTo(0, TAM*0.5); t.lineTo(-TAM, 0); t.lineTo(-TAM, 14); t.lineTo(0, TAM*0.5+14);
        t.closePath(); t.fillPath();

        t.fillStyle(cR, al);
        t.beginPath();
        t.moveTo(0, TAM*0.5); t.lineTo(TAM, 0); t.lineTo(TAM, 14); t.lineTo(0, TAM*0.5+14);
        t.closePath(); t.fillPath();

        t.lineStyle(1, 0x000000, 0.15);
        t.beginPath();
        t.moveTo(0, -TAM*0.5); t.lineTo(TAM, 0); t.lineTo(0, TAM*0.5); t.lineTo(-TAM, 0);
        t.closePath(); t.strokePath();

        if (unlock && !isShop) {
            if (estado === 1) {
                d.fillStyle(0x78350f, 1);
                d.fillCircle(-5, -2, 3); d.fillCircle(4, 1, 3); d.fillCircle(0, -6, 2);
            } else if (estado === 2) {
                d.fillStyle(0x4ade80, 1); d.fillRect(-1, -14, 2, 12); d.fillEllipse(-3, -14, 10, 7);
            } else if (estado === 3) {
                d.fillStyle(0x4ade80, 1); d.fillRect(-1, -20, 2, 18); d.fillEllipse(-5, -18, 13, 9); d.fillEllipse(4, -21, 11, 8);
            } else if (estado === 4) {
                d.fillStyle(0x86efac, 1); d.fillRect(-1, -25, 2, 21); d.fillEllipse(-7, -21, 16, 11); d.fillEllipse(5, -24, 14, 10); d.fillEllipse(-1, -27, 13, 9);
            } else if (estado >= 5) {
                var cul = CULTURAS[G.tipo[x][y] || 'girassol'];
                var fc = cul.fruto || 0xf97316;
                d.fillStyle(0x86efac, 1); d.fillRect(-1, -25, 2, 21); d.fillEllipse(-7, -21, 16, 11); d.fillEllipse(5, -24, 14, 10);
                d.fillStyle(fc, 1); d.fillCircle(-5, -27, 6); d.fillCircle(6, -23, 5);
                d.fillStyle(0xffffff, 0.35); d.fillCircle(-7, -29, 3);
            }
            if (regado && estado < 5) {
                d.fillStyle(0x38bdf8, 0.85); d.fillEllipse(15, -16, 7, 9); d.fillTriangle(11,-13, 19,-13, 15,-21);
            }
        } else if (!unlock) {
            d.fillStyle(0x1e293b, 0.7); d.fillRoundedRect(-7, -13, 14, 12, 3);
            d.lineStyle(2, 0x334155, 0.9);
            d.beginPath(); d.arc(-3.5, -15, 7, Math.PI, 0, false); d.strokePath();
        } else if (isShop) {
            d.fillStyle(0x22d3ee, 0.9); d.fillRect(-9, -17, 18, 12);
            d.fillStyle(0xfacc15, 1); d.fillRect(-5, -21, 10, 5);
            d.fillStyle(0x060d1a, 0.8); d.fillRect(-2, -13, 5, 7);
        }
    },

    drawCursor: function(x, y) {
        this.cursor.clear();
        var p  = this.iso(x, y);
        var h  = this.terreno[x][y];
        var bob = Math.sin(this._ct * 4) * 3;
        var a   = 0.7 + Math.sin(this._ct * 4) * 0.25;
        var cy  = p.y - h - bob;

        this.cursor.lineStyle(2, 0x22d3ee, a);
        this.cursor.beginPath();
        this.cursor.moveTo(p.x,       cy - TAM*0.5);
        this.cursor.lineTo(p.x + TAM, cy);
        this.cursor.lineTo(p.x,       cy + TAM*0.5);
        this.cursor.lineTo(p.x - TAM, cy);
        this.cursor.closePath(); this.cursor.strokePath();

        this.cursor.fillStyle(0x22d3ee, a);
        [[p.x, cy-TAM*0.5],[p.x+TAM,cy],[p.x,cy+TAM*0.5],[p.x-TAM,cy]].forEach(function(c) {
            this.cursor.fillCircle(c[0], c[1], 3);
        }, this);
    },

    updateUI: function() {
        var tx = this.tLogico.x, ty = this.tLogico.y;
        var unlock = G.desbloq[tx][ty];
        var est    = G.plantas[tx][ty];
        var reg    = G.rega[tx][ty];
        var cul    = CULTURAS[G.sementeAtiva];
        var nomes  = ['🌿 Vazio','🌱 Semente','🌿 Broto','🌾 A crescer','🌳 Maduro','✨ Colher!'];
        var label  = !unlock ? '🔒 ' + custoExpansao() + '€' : (tx===0&&ty===0 ? '🏪 Stand' : (nomes[Math.min(est,5)] + (reg?' 💧':'')));
        var ev     = G.eventoDia ? G.eventoDia.msg : '';
        var infra  = '💦' + G.aspersores + ' 👨‍🌾' + G.empregados + ' 🏗️' + G.silos;
        this.txtUI.setText([
            '   💰 ' + G.moedas + '€   📅 Dia ' + G.dia + (G.combo > 1 ? '  🔥x' + G.combo : ''),
            '   🚜 Nv.' + G.nivelTrator + '  🌾' + G.colheitas + '  🧪' + G.aduboRestante + '  ' + infra,
            '   📍 [' + tx + ',' + ty + '] ' + label,
            '   ' + cul.emoji + ' ' + cul.nome + ' — plantar ' + custoPlantio(G.sementeAtiva) + '€ → ~' + cul.ganho + '€',
            '   ' + (ev.length > 36 ? ev.substring(0, 34) + '…' : ev),
        ].join('\n'));
        if (this.txtMissoes && G.missoes) {
            this.txtMissoes.setText(
                '   🎯 MISSÕES\n' +
                G.missoes.map(function(m) {
                    var p = m.id === 'riqueza' ? G.moedas : m.prog;
                    return (m.feita ? '   ✅ ' : '   ○ ') + m.desc + ' ' + Math.min(p, m.alvo) + '/' + m.alvo;
                }).join('\n')
            );
        }
    },

    update: function(t, dt) {
        if (!this.keys || !MaquinaEstados.podeConduzir()) return;
        this._ct += dt / 1000;

        this.trCont.x = Phaser.Math.Linear(this.trCont.x, this.alvoX, 0.18);
        this.trCont.y = Phaser.Math.Linear(this.trCont.y, this.alvoY, 0.18);
        this.trCont.depth = (this.tLogico.x + this.tLogico.y) * 10 + 9;

        this.drawCursor(this.tLogico.x, this.tLogico.y);

        var fill = document.getElementById('growfill');
        if (fill) {
            var dec = t - this._cicloInicio;
            fill.style.width = Math.min((dec / CICLO_MS) * 100, 100) + '%';
        }

        if (MaquinaEstados.podeConduzir() &&
            this.tLogico.x === 0 && this.tLogico.y === 0 &&
            t > (this._cooldownLojaAte || 0) &&
            Math.abs(this.trCont.x - this.alvoX) < 4) {
            MaquinaEstados.irLoja(this.game);
            return;
        }

        if (t >= this._proximoCiclo) {
            this._cicloInicio  = t;
            var mult = (G.eventoDia && G.eventoDia.cicloMult) || 1;
            this._proximoCiclo = t + CICLO_MS * mult;
            for (var x = 0; x < COLS; x++) {
                for (var y = 0; y < ROWS; y++) {
                    if (!G.desbloq[x][y]) continue;
                    var e = G.plantas[x][y];
                    if (e > 0 && e < 5) {
                        var bonus = G.rega[x][y] ? 1 : 0;
                        var extra = CULTURAS[G.tipo[x][y] || 'girassol'].extraCiclo;
                        G.plantas[x][y] = Math.min(e + 1 + bonus + extra, 5);
                        G.rega[x][y] = false;
                        this.drawTile(x, y);
                    }
                }
            }
            autoRegaAspersores(this);
            autoColheitaEmpregados(this, t);
        }

        var tx = this.tLogico.x, ty = this.tLogico.y;

        // MUDADO PARA .isDown PARA PERMITIR AUTOMATIZAÇÃO AO RECOLOCO DE ESPAÇO
        if (this.kSpace.isDown && G.desbloq[tx][ty] && !(tx === 0 && ty === 0)) {
            if (G.plantas[tx][ty] === 0) {
                var culKey = G.sementeAtiva;
                var c = CULTURAS[culKey];
                if (c.requerEstufa && !G.estufa) {
                    toast('🏠 Precisas da Estufa na loja!', 'err');
                } else {
                var cp = custoPlantio(culKey);
                if (G.moedas < cp) {
                    toast('❌ Sementes custam ' + cp + '€', 'err');
                } else {
                G.moedas -= cp;
                G.plantas[tx][ty] = 1;
                G.tipo[tx][ty] = culKey;
                this.drawTile(tx, ty);
                toast(c.emoji + ' ' + c.nome + ' (-' + cp + '€)', 'ok');
                guardarJogo();
                }
                }
            } else if (G.plantas[tx][ty] >= 5) {
                var ganho = ganhoColheita(tx, ty);
                if (t - G.ultimaColheita < 4000) G.combo++;
                else G.combo = 1;
                G.maxCombo = Math.max(G.maxCombo || 0, G.combo);
                G.ultimaColheita = t;
                if (G.combo >= 3) ganho = Math.round(ganho * 1.25);
                G.plantas[tx][ty] = 0;
                G.tipo[tx][ty] = '';
                G.moedas += ganho;
                G.colheitas++;
                progMissao('colheitas', 1);
                progMissao('riqueza', 0);
                this.drawTile(tx, ty);
                this.updateUI();
                var pp = this.iso(tx, ty);
                coinPop(this.game.canvas, pp.x, pp.y - this.terreno[tx][ty] - 30, ganho);
                if (G.combo >= 3) toast('🔥 Combo x' + G.combo + '!', 'war', 1200);
                guardarJogo();
            }
        }

        if (Phaser.Input.Keyboard.JustDown(this.kQ)) {
            var ord = ordemSementes();
            var i = ord.indexOf(G.sementeAtiva);
            G.sementeAtiva = ord[(i + 1) % ord.length];
            var c2 = CULTURAS[G.sementeAtiva];
            toast(c2.emoji + ' Semente: ' + c2.nome + ' (' + c2.ganho + '€)', 'ok');
            this.updateUI();
        }

        if (Phaser.Input.Keyboard.JustDown(this.kU) && G.desbloq[tx][ty]) {
            if (G.aduboRestante <= 0) toast('🧪 Sem adubo! Passa o dia [N]', 'err');
            else if (G.plantas[tx][ty] === 0) toast('🧪 Planta primeiro', 'war');
            else if (G.plantas[tx][ty] >= 5) toast('🧪 Já está pronto para colher', 'war');
            else {
                G.aduboRestante--;
                G.plantas[tx][ty] = Math.min(G.plantas[tx][ty] + 2, 5);
                this.drawTile(tx, ty);
                this.updateUI();
                toast('🧪 Adubo aplicado — cresceu mais!', 'ok');
                guardarJogo();
            }
        }

        if (Phaser.Input.Keyboard.JustDown(this.kR) && G.desbloq[tx][ty]) {
            if (G.regaRestante <= 0)       toast('💧 Sem água! Usa [N] para passar o dia', 'err');
            else if (G.plantas[tx][ty]===0) toast('🤔 Nada para regar', 'war');
            else if (G.rega[tx][ty])        toast('💧 Já está regado!', 'war');
            else {
                G.rega[tx][ty] = true; G.regaRestante--;
                this.drawTile(tx, ty); this.updateUI();
                toast('💧 Regado! Cresce mais rápido.', 'ok');
            }
        }

        if (Phaser.Input.Keyboard.JustDown(this.kE)) {
            if (G.desbloq[tx][ty])           toast('✅ Já desbloqueado', 'war');
            else {
                var ce = custoExpansao();
                if (G.moedas < ce) toast('❌ Precisas de ' + ce + '€', 'err');
                else {
                G.moedas -= ce; G.totalGasto = (G.totalGasto || 0) + ce;
                G.desbloq[tx][ty] = true; G.plantas[tx][ty] = 0;
                G.tipo[tx][ty] = '';
                G.expansoes++; progMissao('expandir', 1); progMissao('riqueza', 0); progMissao('gastar', ce);
                this.drawTile(tx, ty); this.updateUI();
                toast('🗺 Expandido! (-' + ce + '€)', 'ok');
                guardarJogo();
                }
            }
        }

        if (Phaser.Input.Keyboard.JustDown(this.kN)) {
            var imposto = Math.min(Math.floor(G.moedas * 0.04), 400 + G.dia * 100);
            var rendimento = G.silos * 200 + G.celeiroNv * 500;
            G.dia++;
            G.aduboRestante = 2;
            G.combo = 0;
            novoEventoDia();
            G.regaRestante = 5 + (G.eventoDia.rega || 0);
            G.moedas -= imposto;
            G.moedas += rendimento;
            this.updateUI();
            toast('📅 Dia ' + G.dia + ' — ' + G.eventoDia.msg, 'ok', 2800);
            if (imposto > 0) setTimeout(function() { toast('🏛️ Impostos: -' + imposto + '€', 'war', 2500); }, 400);
            if (rendimento > 0) setTimeout(function() { toast('🏗️ Rendimento: +' + rendimento + '€', 'ok', 2500); }, 900);
            guardarJogo();
        }

        if (t < this._proximoMov) return;
        var mov = false;
        var k = this.keys;
        if (k.up.isDown    && ty > 0)        { this.tLogico.y--; mov = true; }
        else if (k.down.isDown  && ty<ROWS-1) { this.tLogico.y++; mov = true; }
        if (k.left.isDown  && tx > 0)        { this.tLogico.x--; this.trCont.setScale(-1,1); mov = true; }
        else if (k.right.isDown && tx<COLS-1) { this.tLogico.x++; this.trCont.setScale(1,1);  mov = true; }

        if (mov) {
            var h2 = this.terreno[this.tLogico.x][this.tLogico.y];
            var p2 = this.iso(this.tLogico.x, this.tLogico.y);
            this.alvoX = p2.x; this.alvoY = p2.y - h2;
            this._proximoMov = t + G.velTrator;
            this.updateUI();
        }
    }
});

// ─── CENA LOJA ───────────────────────────────────────────────────
var CenaLoja = new Phaser.Class({
    Extends: Phaser.Scene,
    initialize: function() { Phaser.Scene.call(this, { key: 'CenaLoja' }); },

    sairLoja: function() {
        if (!MaquinaEstados.esta(Estado.LOJA) || this._aSair) return;
        this._aSair = true;
        toast('👋 De volta ao campo!', 'ok');
        MaquinaEstados.irCampo(this.game, true);
    },

    comprarIndice: function(idx) {
        var cat = getCatalogoLoja();
        if (idx < 0 || idx >= cat.length) return;
        if (comprarLojaItem(cat[idx].id)) {
            this.drawLojaLista();
            this.drawTratorLoja();
            this.updateNivel();
            this.updateSaldo();
            this.updateStats();
            if (this.trShow) {
                this.tweens.add({
                    targets: this.trShow, scaleX: 1.1, scaleY: 1.1,
                    duration: 160, yoyo: true, ease: 'Back.easeOut'
                });
            }
        }
    },

    drawLojaLista: function() {
        var self = this;
        if (this._lojaCards) {
            this._lojaCards.forEach(function(o) {
                if (o.bg) o.bg.destroy();
                if (o.txt) o.txt.destroy();
                if (o.zone) o.zone.destroy();
            });
        }
        this._lojaCards = [];
        if (this.lojaListaGfx) this.lojaListaGfx.clear();
        else this.lojaListaGfx = this.add.graphics().setDepth(50);

        var cat = getCatalogoLoja();
        var cx = 530, cw = 420, ch = 72, startY = 168;
        var scroll = this._lojaScroll || 0;

        cat.forEach(function(it, i) {
            var y = startY + i * (ch + 8) - scroll;
            if (y < 155 || y > 615) return;
            var nv = nivelLoja(it.id);
            var maxed = nv >= it.max;
            var custo = maxed ? null : custoLojaItem(it);
            var can = custo !== null && G.moedas >= custo;

            var bg = self.add.graphics().setDepth(90);
            bg.fillStyle(maxed ? 0x052e16 : (can ? 0x0c1a2e : 0x1f0808), 0.85);
            bg.fillRoundedRect(cx, y, cw, ch, 8);
            bg.lineStyle(2, maxed ? 0x4ade80 : (can ? 0x38bdf8 : 0xf87171), 0.75);
            bg.strokeRoundedRect(cx, y, cw, ch, 8);

            var num = (i + 1) % 10;
            var linha1 = it.emoji + ' ' + it.nome + (maxed ? ' ✓' : ' — ' + custo + '€');
            var linha2 = it.desc + (maxed ? '' : '  [' + num + ']');
            var txt = self.add.text(cx + 14, y + ch/2, linha1 + '\n' + linha2, {
                fontFamily: "'Exo 2',sans-serif", fontSize: '12px', fontStyle: 'bold',
                color: maxed ? '#4ade80' : (can ? '#e2e8f0' : '#f87171'), lineSpacing: 4
            }).setOrigin(0, 0.5).setDepth(95);

            var zone = null;
            if (!maxed) {
                zone = self.add.zone(cx + cw/2, y + ch/2, cw, ch)
                    .setInteractive({ useHandCursor: true }).setDepth(96)
                    .on('pointerdown', (function(ii) { return function() { self.comprarIndice(ii); }; })(i));
            }
            self._lojaCards.push({ bg: bg, txt: txt, zone: zone });
        });

        if (this.txtLojaScroll) this.txtLojaScroll.destroy();
        this.txtLojaScroll = this.add.text(740, 628, 'Roda do rato para ver mais · [1-9] comprar', {
            fontFamily: "'Exo 2',sans-serif", fontSize: '10px', color: '#475569'
        }).setOrigin(0.5).setDepth(100);
    },

    create: function() {
        if (this.game.canvas) {
            this.game.canvas.setAttribute('tabindex', '1');
            this.game.canvas.focus();
        }
        this._aSair = false;
        MaquinaEstados.mudar(Estado.LOJA);
        this.kT     = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.T);
        this.kEnter = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.ENTER);
        this.kSpace = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
        this.kEsc   = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.ESC);
        this.kVoltar = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.V);
        this._lojaScroll = 0;
        this._lojaCards = [];
        this._teclasNum = [
            Phaser.Input.Keyboard.KeyCodes.ONE, Phaser.Input.Keyboard.KeyCodes.TWO,
            Phaser.Input.Keyboard.KeyCodes.THREE, Phaser.Input.Keyboard.KeyCodes.FOUR,
            Phaser.Input.Keyboard.KeyCodes.FIVE, Phaser.Input.Keyboard.KeyCodes.SIX,
            Phaser.Input.Keyboard.KeyCodes.SEVEN, Phaser.Input.Keyboard.KeyCodes.EIGHT,
            Phaser.Input.Keyboard.KeyCodes.NINE
        ];
        this.kNum = [];
        for (var ki = 0; ki < this._teclasNum.length; ki++) {
            this.kNum.push(this.input.keyboard.addKey(this._teclasNum[ki]));
        }
        this.input.on('wheel', function(p, dx, dy) {
            this._lojaScroll = Phaser.Math.Clamp((this._lojaScroll || 0) + dy * 0.4, 0, Math.max(0, getCatalogoLoja().length * 80 - 420));
            this.drawLojaLista();
        }, this);

        var bg = this.add.graphics();
        bg.fillGradientStyle(0x0a0f1e, 0x0a0f1e, 0x111827, 0x111827, 1);
        bg.fillRect(0, 0, 1000, 750);

        bg.lineStyle(1, 0x1e293b, 0.4);
        for (var i = 0; i < 1000; i += 60) { bg.beginPath(); bg.moveTo(i,0); bg.lineTo(i,750); bg.strokePath(); }
        for (var j = 0; j < 750;  j += 60) { bg.beginPath(); bg.moveTo(0,j); bg.lineTo(1000,j); bg.strokePath(); }

        var glow = this.add.graphics();
        glow.fillGradientStyle(0x0ea5e9, 0x0ea5e9, 0x0a0f1e, 0x0a0f1e, 0.06, 0.06, 0, 0);
        glow.fillRect(0, 0, 1000, 200);

        this.add.text(500, 52, 'STAND DA QUINTA', {
            fontFamily: "'Press Start 2P',monospace",
            fontSize: '26px', color: '#facc15',
            shadow: { blur: 25, color: '#f97316', fill: true }
        }).setOrigin(0.5);
        this.add.text(500, 90, '— a garagem dos campeões —', {
            fontFamily: "'Exo 2',sans-serif",
            fontSize: '13px', fontStyle: 'italic', color: '#475569'
        }).setOrigin(0.5);

        var saidaGfx = this.add.graphics();
        saidaGfx.fillStyle(0x0e7490, 0.85); saidaGfx.fillRect(0, 280, 72, 150);
        saidaGfx.lineStyle(2, 0x22d3ee, 1);  saidaGfx.strokeRect(0, 280, 72, 150);

        this.btnSair = this.add.text(36, 355, '◀  SAIR', {
            fontFamily: "'Exo 2',sans-serif", fontSize: '14px', fontStyle: 'bold',
            color: '#22d3ee', backgroundColor: '#0e7490ee',
            padding: { x: 12, y: 10 }
        }).setOrigin(0.5).setDepth(10000)
            .setInteractive({ useHandCursor: true })
            .on('pointerdown', this.sairLoja, this)
            .on('pointerover', function() { this.setStyle({ color: '#facc15' }); }, this)
            .on('pointerout', function() { this.setStyle({ color: '#22d3ee' }); }, this);
        this.tweens.add({ targets: this.btnSair, x: 30, duration: 600, yoyo: true, repeat: -1 });

        var pod = this.add.graphics();
        pod.fillStyle(0x6d28d9, 0.08); pod.fillRoundedRect(130, 130, 320, 420, 16);
        pod.lineStyle(1, 0x7c3aed, 0.4); pod.strokeRoundedRect(130, 130, 320, 420, 16);
        this.add.text(290, 158, '🚜  O MEU TRATOR', {
            fontFamily: "'Exo 2',sans-serif", fontSize: '13px', fontStyle: 'bold', color: '#a78bfa'
        }).setOrigin(0.5);

        var pPlat = this.add.graphics();
        pPlat.fillStyle(0x1e293b, 1); pPlat.fillEllipse(290, 420, 180, 40);
        pPlat.lineStyle(1, 0x334155, 0.6); pPlat.strokeEllipse(290, 420, 180, 40);

        this.trShow = this.add.container(290, 340);
        this.trGfx = this.add.graphics();
        this.trShow.add(this.trGfx);
        this.drawTratorLoja();
        this.tweens.add({ targets: this.trShow, y: '-=9', duration: 1100, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });

        this.txtNivel = this.add.text(290, 460, '', {
            fontFamily: "'Exo 2',sans-serif", fontSize: '13px', fontStyle: 'bold',
            color: '#e2e8f0', align: 'center', lineSpacing: 5
        }).setOrigin(0.5);
        this.updateNivel();

        var sp = this.add.graphics();
        sp.fillStyle(0x060d1a, 0.96); sp.fillRoundedRect(510, 120, 460, 620, 16);
        sp.lineStyle(1, 0x1e293b, 0.8); sp.strokeRoundedRect(510, 120, 460, 620, 16);
        sp.lineStyle(2, 0xfacc15, 0.5);
        sp.beginPath(); sp.moveTo(530,160); sp.lineTo(950,160); sp.strokePath();
        this.add.text(740, 140, '🛒  UPGRADES DISPONÍVEIS', {
            fontFamily: "'Exo 2',sans-serif", fontSize: '15px', fontStyle: 'bold', color: '#f8fafc'
        }).setOrigin(0.5);

        this.drawLojaLista();

        var sY = 640;
        sp.lineStyle(1, 0x1e293b, 0.8);
        sp.beginPath(); sp.moveTo(530, sY-10); sp.lineTo(950, sY-10); sp.strokePath();
        this.add.text(740, sY+5, '📊  ESTATÍSTICAS', {
            fontFamily: "'Exo 2',sans-serif", fontSize: '12px', fontStyle: 'bold', color: '#475569'
        }).setOrigin(0.5);
        this.txtStats = this.add.text(740, sY+28, '', {
            fontFamily: "'Exo 2',sans-serif", fontSize: '13px', color: '#64748b',
            lineSpacing: 7, align: 'center'
        }).setOrigin(0.5);
        this.updateStats();

        var salBg = this.add.graphics().setDepth(999);
        salBg.fillStyle(0x060d1a, 0.92); salBg.lineStyle(1,0xfacc15,0.4);
        salBg.fillRoundedRect(335, 700, 330, 40, 10);
        salBg.strokeRoundedRect(335, 700, 330, 40, 10);
        this.txtSaldo = this.add.text(500, 720, '', {
            fontFamily: "'Exo 2',sans-serif", fontSize: '17px', fontStyle: 'bold',
            color: '#facc15', shadow: { blur: 8, color: '#f97316', fill: true }
        }).setOrigin(0.5).setDepth(1000);
        this.updateSaldo();
        this.add.text(500, 668, '[1-9] comprar  ·  [ESC]/[V]/◀ SAIR', {
            fontFamily: "'Exo 2',sans-serif", fontSize: '11px', color: '#64748b'
        }).setOrigin(0.5).setDepth(1000);
        toast('🛒 Stand — gasta € em upgrades! [1-9] ou clica', 'ok', 3500);
    },

    drawTratorLoja: function() {
        var g = this.trGfx, s = 2.3, x = 0, y = 0;
        var cor = G.nivelTrator === 1 ? 0xef4444 : (G.nivelTrator === 3 ? 0x8b5cf6 : 0xeab308);
        g.clear();
        g.fillStyle(0x000000, 0.18); g.fillEllipse(x, y + 22*s, 55*s, 18);
        g.fillStyle(0x111827, 1);
        g.fillCircle(x-17*s, y+8*s, 13*s); g.fillCircle(x+17*s, y+8*s, 13*s);
        g.fillStyle(0x374151, 1);
        g.fillCircle(x-17*s, y+8*s, 7*s); g.fillCircle(x+17*s, y+8*s, 7*s);
        g.fillStyle(cor, 1);
        g.fillRoundedRect(x-19*s, y-30*s, 38*s, 36*s, 6);
        g.fillStyle(0x22d3ee, 0.92);
        g.fillRoundedRect(x-11*s, y-24*s, 22*s, 13*s, 4);
        g.fillStyle(0xffffff, 0.3);
        g.fillRect(x-9*s, y-22*s, 6*s, 5*s);
        g.fillStyle(0x1f2937, 1);
        g.fillRect(x+10*s, y-42*s, 6*s, 14*s);
        if (G.nivelTrator >= 2) { g.fillStyle(0xf97316,1); g.fillCircle(x+13*s, y-43*s, 6); }
        if (G.nivelTrator >= 3) { g.fillStyle(0x8b5cf6,1); g.fillRect(x-20*s,y-28*s,4*s,10); g.fillRect(x+16*s,y-28*s,4*s,10); }
    },

    updateNivel: function() {
        var nomes = ['—','🔴 CLÁSSICO','🟡 TURBO','🚀 HIPER'];
        this.txtNivel.setText(
            'Nível ' + G.nivelTrator + ' — ' + (nomes[G.nivelTrator]||'') + '\n' +
            'Gasto total na loja: ' + (G.totalGasto || 0) + '€'
        );
    },

    updateStats: function() {
        this.txtStats.setText([
            '🌾  Colheitas: ' + G.colheitas,
            '🗺   Expansões: ' + G.expansoes,
            '💦 Aspersores: ' + G.aspersores + '  👨‍🌾: ' + G.empregados,
            '🏗️ Silos: ' + G.silos + '  🌾 Celeiro: ' + G.celeiroNv,
            '✨ Ouro nv.' + (G.ouroNv || 0) + '  🏠 Estufa: ' + (G.estufa ? 'Sim' : 'Não'),
        ].join('\n'));
    },

    updateSaldo: function() {
        this.txtSaldo.setText('💰  Saldo: ' + G.moedas + '€');
    },

    update: function() {
        if (!MaquinaEstados.esta(Estado.LOJA)) return;

        if (Phaser.Input.Keyboard.JustDown(this.kEsc) ||
            Phaser.Input.Keyboard.JustDown(this.kVoltar)) {
            this.sairLoja();
            return;
        }

        var cat = getCatalogoLoja();
        for (var i = 0; i < this.kNum.length && i < cat.length; i++) {
            if (Phaser.Input.Keyboard.JustDown(this.kNum[i])) {
                this.comprarIndice(i);
                return;
            }
        }
    }
});

// ─── BOOT ────────────────────────────────────────────────────────
window.addEventListener('load', function() {
    MaquinaEstados.mudar(Estado.CAMPO);
    new Phaser.Game({
        type: Phaser.AUTO,
        width: 1000,
        height: 750,
        backgroundColor: '#060d1a',
        parent: 'game-wrapper',
        scene: [CenaQuinta, CenaLoja]
    });
});
</script>
</body>
</html>
